function block(parent,raw){const lines=raw.split('\n').filter(x=>x.trim());if(!lines.length)return;

for(let c=58;c<=84;c++){const left=lines.map(x=>x.slice(0,c).trim());const right=lines.map(x=>x.slice(c).trim());const paired=lines.filter((x,i)=>left[i].length>8&&right[i].length>8).length;

if(clear&&paired>=2&&left.filter(x=>x.length>8).length>=2&&right.filter(x=>x.length>8).length>=2){const score=paired;if(!best||score>best.score)best={left,right,score};}}

if(k==='A02'||k==='A03'){const wrap=el('div',undefined,'sst-gallery-wrap');wrap.append(gallery,el('p',k==='A03'?['Formas e cores das famílias de sinais — exemplos ilustrativos, não sinalização regulamentar.','Sign families: shapes and colours — illustrative examples, not regulatory signage.','Familias de señales: formas y colores — ejemplos ilustrativos, no señalización reglamentaria.','संकेतका आकार र रङ — बुझाउने उदाहरण मात्र, आधिकारिक संकेत होइनन्।','संकेतों के आकार और रंग — केवल उदाहरण, आधिकारिक संकेत नहीं।'][lang]:['Pictogramas ilustrativos. A proteção deve ser escolhida em função do risco.','Illustrative pictograms. Select protection according to the risk.','Pictogramas ilustrativos. Elige la protección según el riesgo.','बुझाउने चित्रहरू। जोखिमअनुसार सुरक्षा छान्नुहोस्।','समझाने वाले चित्र। जोखिम के अनुसार सुरक्षा चुनें।'][lang],'subnote'));return wrap;}return gallery;}
function showPage(parent,p){const article=el('article',undefined,'article');article.lang='pt';article.append(el('div',t(14)+' '+p.page,'page-label'));let raw=p.text;let m=raw.match(/^\s*[A-J]\d{2}\s*·[^\n]*$/m);if(m){raw=raw.slice(m.index+m[0].length).trimStart();}for(const b of raw.split(/\n\s*\n/))block(article,b);const detail=el('details');detail.append(el('summary',t(13)),el('pre',p.text,'raw'));article.append(detail);parent.append(article);}

const STRUCT={pt:{},layout:{},tileIcons:{}};for(const pack of [window.PERSEA_SST_LAYOUT_A,window.PERSEA_SST_LAYOUT_B1,window.PERSEA_SST_LAYOUT_B2,window.PERSEA_SST_LAYOUT_C1,window.PERSEA_SST_LAYOUT_C2,window.PERSEA_SST_LAYOUT_C3,window.PERSEA_SST_LAYOUT_C4,window.PERSEA_SST_LAYOUT_C5,window.PERSEA_SST_LAYOUT_D1,window.PERSEA_SST_LAYOUT_D2,window.PERSEA_SST_LAYOUT_D3,window.PERSEA_SST_LAYOUT_D4,window.PERSEA_SST_LAYOUT_E1,window.PERSEA_SST_LAYOUT_E2,window.PERSEA_SST_LAYOUT_F1,window.PERSEA_SST_LAYOUT_F2]){if(!pack)continue;for(const key of ['pt','layout','tileIcons'])Object.assign(STRUCT[key],pack[key]||{});Object.assign(TR,pack.translations||{});}
function structuredText(k){return lang?TR[k]?.[LANG[lang]]:STRUCT.pt?.[k];}
function putLines(parent,lines,splitSemi=false){
  let list=null;
  for(const line of lines){if(!line.trim())continue;
    const bullet=line.match(/^•\s*(.*)$/);
    if(bullet){if(!list){list=el('ul',undefined,'sst-list');parent.append(list);}list.append(el('li',bullet[1]));continue;}
    list=null;
    if(splitSemi&&line.split(';').length>=3){const ul=el('ul',undefined,'sst-list');for(const part of line.split(';'))ul.append(el('li',part.trim()));parent.append(ul);}
    else parent.append(el('p',line,'sst-paragraph'));
  }
}
function tileText(tile,line,headingOverride){
 const clean=line.replace(/^•\s*/,'').replace(/^[0-9०-९]+[.)]\s*/,'');
 const at=clean.indexOf(':');
 if(at>0&&at<95){tile.append(el('h4',headingOverride||clean.slice(0,at)));putLines(tile,[clean.slice(at+1).trim()]);}
 else{if(headingOverride)tile.append(el('h4',headingOverride));putLines(tile,[clean]);}
}

function renderStructured(root,k,txt){
 const sections=txt.split(/\n\n+/), layout=STRUCT.layout[k];
 if(sections.length!==layout.length)return false;
 const article=el('article',undefined,'article sst-structured');article.lang=['pt','en','es','ne','hi'][lang];
 let pair=null;
 for(const [i,section] of sections.entries()){
  const mode=layout[i],lines=section.split('\n'),ids=STRUCT.tileIcons?.[k]?.[i]||[];
  if(mode!=='pair')pair=null;
  if(mode==='intro'){const h=el('div',undefined,'sst-intro');putLines(h,lines.slice(1));article.append(h);continue;}
  if(mode==='note'){const note=el('div',undefined,'sst-note');putLines(note,lines);article.append(note);continue;}
  if(mode==='pair'){
   if(!pair){pair=el('div',undefined,'sst-pair');article.append(pair);}
   const card=el('section',undefined,'sst-content-card');card.append(el('h3',lines.shift()));putLines(card,lines,true);pair.append(card);continue;
  }
  if(['tiles','steps','ppe','signs','contacts','clp'].includes(mode)){
   const sectionBox=el('section',undefined,'sst-section');
   if(!(k==='A02'&&i===7))sectionBox.append(el('h3',lines.shift()));
   else sectionBox.append(el('h3',['Três momentos para te protegeres','Three moments for protection','Tres momentos para protegerte','सुरक्षाका तीन चरण','सुरक्षा के तीन चरण'][lang]));
   if(k==='A02'&&i===5)putLines(sectionBox,[lines.shift()]);
   const grid=el('div',undefined,'sst-content-grid '+(mode==='steps'?'sst-step-grid':'')+(mode==='signs'?' sst-sign-grid':''));
   for(const [j,line] of lines.entries()){
    const card=el('div',undefined,'sst-content-card sst-tile');
    if(mode==='signs'){card.append(signIcon(j));}else if(mode==='clp'){card.append(clpIcon(j));}
    else if(ids[j]){card.append(visualIcon(V.icons?.[ids[j]]?ids[j]:'shield'));}
    if(mode==='steps'){const num=el('span',String(j+1).padStart(2,'0'),'sst-step-number');card.append(num);}
    if(mode==='contacts'){const parts=line.match(/^([\d ]+):\s*(.*)$/);if(parts){const a=el('a',parts[1],'sst-contact-number');a.href='tel:'+parts[1].replace(/\s/g,'');card.append(a);putLines(card,[parts[2]]);if(parts[1].trim()==='112')card.classList.add('sst-contact-emergency');}else tileText(card,line);}else tileText(card,line,mode==='ppe'?V.PPE?.[j]?.[lang+1]:undefined);grid.append(card);
   }
   sectionBox.append(grid);article.append(sectionBox);continue;
  }
  const card=el('section',undefined,mode.startsWith('warning')?'sst-warning':'sst-info');
  if(mode.startsWith('warning'))card.append(visualIcon('alert'));
  const body=el('div',undefined,'sst-callout-body');
  if(mode==='warningHead'||(mode==='warning'&&lines.length>1))body.append(el('h3',lines.shift()));
  putLines(body,lines);card.append(body);article.append(card);
 }
 const refs=el('details',undefined,'sst-source');
 refs.append(el('summary',t(12)));
 for(const p of D[k].pages)showPage(refs,p);
 article.append(refs);root.append(article);return true;
}

function render(){document.documentElement.lang=['pt','en','es','ne','hi'][lang];$('brandTitle').textContent=t(0);$('title').textContent=t(0);$('subtitle').textContent=t(1);$('count').textContent=Object.keys(D).length+' '+t(6);$('home').textContent=t(3);$('home').href='../?lang='+LANG[lang];$('chemical').textContent=t(10);const n=Object.keys(D).filter(k=>TR[k]?.[LANG[lang]]).length;$('translationCount').hidden=!lang;$('translationCount').textContent=lang?`${n}/61 · ${['','Leaflets in English','Folletos en español','नेपाली जानकारी पत्र','हिन्दी जानकारी पत्रक'][lang]}`:'';$('search').placeholder=t(2);$('search').setAttribute('aria-label',t(2));$('emergency').textContent=t(11)+' · 112';
const root=$('body');root.replaceChildren();if(Object.keys(D).length!==61){root.append(el('p',t(15)));return;}
const q=norm($('search').value.trim());
if(ref&&!q){const d=D[ref];root.append(btn(t(5),'back',()=>{ref='';go()}),el('h2',ref+' · '+title(ref)));const formatted=structuredText(ref);if(formatted&&STRUCT.layout?.[ref]&&renderStructured(root,ref,formatted))return;const gallery=visualGallery(ref);if(gallery)root.append(gallery);const tr=lang&&TR[ref]?.[LANG[lang]];if(tr){const article=el('article',undefined,'article');article.lang=['pt','en','es','ne','hi'][lang];for(const [i,section] of tr.split(/\n\n+/).entries()){const lines=section.split('\n');if(i===0){article.append(el('h3',lines.shift()));}else if(lines.length>1&&!lines[0].startsWith('•')&&lines[0].length<80){article.append(el('h3',lines.shift()));}if(lines.length)addText(article,lines.join('\n'));}root.append(article);const orig=el('details');orig.append(el('summary',t(12)));for(const p of d.pages)showPage(orig,p);root.append(orig);}else{if(lang)root.append(el('p',t(12),'subnote'));for(const p of d.pages)showPage(root,p);}return;}
if(cat||q){root.append(btn(t(4),'back',()=>{cat='';ref='';$('search').value='';go()}));if(cat&&!q)root.append(el('h2',CATS[cat][lang]));const list=el('div',undefined,'topics');const keys=Object.keys(D).filter(k=>(q||k[0]===cat)&&(!q||norm(k+' '+D[k].title+' '+(TITLES[k]||[]).join(' ')+' '+CATS[k[0]].join(' ')+' '+D[k].pages.map(p=>p.text).join(' ')+' '+Object.values(TR[k]||{}).join(' ')).includes(q)));for(const k of keys){const b=btn('','topic',()=>{cat=k[0];ref=k;$('search').value='';go()});const labelBox=el('span',undefined,'sst-topic-label');labelBox.append(el('strong',k),el('span',title(k)));if(V.map?.[k])b.append(visualIcon(V.map[k].split(' ')[0]));b.append(labelBox);if(lang){const available=TR[k]?.[LANG[lang]];labelBox.append(el('small',available?['','English','Español','नेपाली','हिन्दी'][lang]:'Português','subnote'));}list.append(b);}if(!keys.length)list.append(el('p',t(9)));root.append(list);return;}
const grid=el('div',undefined,'menu');for(const [i,k] of Object.keys(CATS).entries()){const b=btn('','category',()=>{cat=k;go()});const categoryIcons=['shield','alarm','tractor','bottle','box','sun','tool','health','leaf','avocado'];const icon=V.icons?visualIcon(categoryIcons[i]):el('span',ICONS[i],'icon');icon.setAttribute('aria-hidden','true');b.append(icon,el('strong',CATS[k][lang]),el('small',Object.keys(D).filter(x=>x.startsWith(k)).length+' '+t(6)));grid.append(b);}root.append(grid);}
$('lang').addEventListener('change',()=>{lang=Math.max(0,LANG.indexOf($('lang').value));render()});$('search').addEventListener('input',()=>{ref='';render()});render();});
