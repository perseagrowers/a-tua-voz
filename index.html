const rightsData2026={"PT":[["Salários e alimentação","Em 2026, o mínimo nacional é 920 €. No CCT AHSA–SETAAB, o nível 11 é 925 € brutos/mês a tempo completo. O subsídio de alimentação é 6 € por dia quando trabalhas mais de metade do período normal diário. Tens direito a recibo discriminado."],["Horário e descanso","8 horas/dia e 40/semana em regime normal. Pausa de 30 minutos a 2 horas; descanso diário geralmente de 11 horas. Descanso semanal obrigatório. As horas efetivas devem ser registadas."],["Horas extraordinárias","Até 100 h/ano: +25% primeira hora, +37,5% seguintes; descanso semanal ou feriado +50% por hora. Acima de 100 h: +50%, +75% e +100%, respetivamente. Limite geral do CCT: 200 h/ano e 2 h por dia normal, salvo exceções legais."],["Trabalho noturno e regimes especiais","Das 20h às 7h: +25%. Isenção exige acordo escrito: 25% da retribuição mínima na modalidade sem limites normais; 5–10% nas restantes, sem prejuízo das garantias legais. Adaptabilidade e banco de horas exigem condições legais e compensação."],["Férias e subsídios","22 dias úteis de férias por ano; possível majoração por assiduidade. No ano de admissão, 2 dias úteis/mês até 20, em regra após 6 meses. Direito a subsídios de férias e Natal."],["Doença, parentalidade e formação","Direito a faltas justificadas, licenças parentais e proteção social nas condições legais. Formação contínua: 40 horas anuais, proporcional nos contratos a termo de pelo menos 3 meses."],["Igualdade, segurança e ETT","Direito a tratamento igual, condições seguras, EPI gratuitos, informação sobre o contrato e representação sindical. Trabalhadores temporários têm direito à remuneração mais favorável nos termos do art. 185.º do Código do Trabalho. Podes reclamar sem represálias."]],"EN":[["Pay and meals","In 2026 the national minimum is €920. Under AHSA–SETAAB, level 11 is €925 gross/month for full-time work. Meal allowance: €6 per day when working more than half your normal daily hours. You are entitled to an itemised payslip."],["Working hours and rest","Normally 8 hours/day and 40/week. Breaks of 30 minutes to 2 hours; generally 11 hours of daily rest. Mandatory weekly rest. Actual hours must be recorded."],["Overtime","Up to 100 hours/year: +25% first hour, +37.5% subsequent hours; weekly rest days or holidays +50% per hour. Above 100 hours: +50%, +75% and +100% respectively. General collective agreement limits: 200 hours/year and 2 hours per normal working day, subject to legal exceptions."],["Night work and special schedules","20:00–07:00: +25%. Exemption from fixed working hours requires written agreement: 25% of minimum pay for the unrestricted normal-hours arrangement; 5–10% for other arrangements, subject to statutory guarantees. Flexible averaging and time banks require legal conditions and compensation."],["Holidays and allowances","22 working days of paid annual leave, potentially increased for attendance. In the hiring year: 2 working days/month up to 20, generally after 6 months. Holiday and Christmas allowances."],["Illness, parental rights and training","Justified absences, parental leave and social protection subject to legal conditions. Continuing training: 40 hours/year, proportional for fixed-term contracts of at least 3 months."],["Equality, safety and agency workers","Equal treatment, safe working conditions, free PPE, employment information and union representation. Temporary agency workers are entitled to the more favourable pay under Labour Code article 185. You may complain without retaliation."]],"ES":[["Salarios y alimentación","En 2026 el mínimo nacional es 920 €. En el convenio AHSA–SETAAB, el nivel 11 es 925 € brutos/mes a jornada completa. Ayuda de comida: 6 € por día si trabajas más de la mitad de la jornada normal. Derecho a nómina detallada."],["Horario y descanso","Normalmente 8 horas/día y 40/semana. Pausa de 30 minutos a 2 horas; descanso diario generalmente de 11 horas. Descanso semanal obligatorio. Deben registrarse las horas reales."],["Horas extraordinarias","Hasta 100 h/año: +25% primera hora, +37,5% siguientes; descanso semanal o festivo +50% por hora. Por encima de 100 h: +50%, +75% y +100%, respectivamente. Límite general del convenio: 200 h/año y 2 h por día normal, salvo excepciones legales."],["Trabajo nocturno y regímenes especiales","De 20:00 a 07:00: +25%. La exención de horario exige acuerdo escrito: 25% de la remuneración mínima en modalidad sin límites normales; 5–10% en las demás, respetando garantías legales. Adaptabilidad y banco de horas requieren condiciones legales y compensación."],["Vacaciones y pagas","22 días laborables de vacaciones pagadas al año, ampliables por asistencia. Año de contratación: 2 días laborables/mes hasta 20, normalmente tras 6 meses. Pagas de vacaciones y Navidad."],["Enfermedad, parentalidad y formación","Ausencias justificadas, permisos parentales y protección social según la ley. Formación continua: 40 horas anuales, proporcional en contratos temporales de al menos 3 meses."],["Igualdad, seguridad y ETT","Igualdad, condiciones seguras, EPI gratuitos, información contractual y representación sindical. Trabajadores de ETT: remuneración más favorable según el artículo 185 del Código del Trabajo. Puedes reclamar sin represalias."]],"NE":[["तलब र खाना भत्ता","२०२६ मा राष्ट्रिय न्यूनतम तलब €920 हो। AHSA–SETAAB सम्झौताको तह ११ मा पूर्णकालीन कामको मासिक कुल न्यूनतम तलब €925 हो। दैनिक सामान्य कामको आधाभन्दा बढी काम गरेमा €6 खाना भत्ता पाइन्छ। तलबको विस्तृत विवरण पाउने अधिकार छ।"],["कामको समय र विश्राम","सामान्यतया दिनमा ८ र हप्तामा ४० घण्टा। विश्राम ३० मिनेटदेखि २ घण्टासम्म; दैनिक विश्राम सामान्यतया ११ घण्टा। साप्ताहिक अनिवार्य विश्राम। वास्तविक कामको समय दर्ता गर्नुपर्छ।"],["अतिरिक्त काम","वार्षिक १०० घण्टासम्म पहिलो घण्टा +25%, त्यसपछि +37.5%; साप्ताहिक विश्राम वा सार्वजनिक बिदामा प्रति घण्टा +50%। १०० घण्टाभन्दा माथि क्रमशः +50%, +75% र +100%। सामान्य सीमा वर्षमा २०० घण्टा र सामान्य कार्यदिवसमा २ घण्टा, कानुनी अपवाद बाहेक।"],["रात्रि काम र विशेष समय व्यवस्था","राति ८ बजेदेखि बिहान ७ बजेसम्म +25%। निश्चित समयको सीमाबाट छुटका लागि लिखित सम्झौता आवश्यक छ: सामान्य समय सीमामा नबाँधिने व्यवस्थामा न्यूनतम तलबको 25%, अन्यमा 5–10%, कानुनी संरक्षण लागू हुन्छ। लचिलो समय र समय बैंकका लागि कानुनी सर्त र क्षतिपूर्ति आवश्यक छन्।"],["बिदा र भत्ता","वर्षमा २२ कार्यदिवस सशुल्क बिदा; उपस्थितिका आधारमा थप दिन सम्भव। नियुक्ति वर्षमा प्रति महिना २ कार्यदिवस, बढीमा २०, सामान्यतया ६ महिनापछि। बिदा र क्रिसमस भत्ता।"],["बिरामी, अभिभावकत्व र तालिम","कानुनी सर्तअनुसार उचित अनुपस्थिति, अभिभावक बिदा र सामाजिक सुरक्षा। वार्षिक ४० घण्टा तालिम; कम्तीमा ३ महिनाको निश्चित अवधिको सम्झौतामा समानुपातिक।"],["समानता, सुरक्षा र अस्थायी कामदार","समान व्यवहार, सुरक्षित काम, निःशुल्क सुरक्षा उपकरण, सम्झौताको जानकारी र श्रमिक संघको प्रतिनिधित्वको अधिकार। अस्थायी एजेन्सीका कामदारलाई श्रम संहिताको धारा १८५ अनुसार बढी अनुकूल तलब पाउने अधिकार छ। प्रतिशोध बिना गुनासो गर्न सकिन्छ।"]],"HI":[["वेतन और भोजन भत्ता","2026 में राष्ट्रीय न्यूनतम वेतन €920 है। AHSA–SETAAB समझौते के स्तर 11 में पूर्णकालिक काम का न्यूनतम सकल मासिक वेतन €925 है। सामान्य दैनिक समय के आधे से अधिक काम करने पर €6 भोजन भत्ता। विस्तृत वेतन पर्ची पाने का अधिकार है।"],["कार्य समय और आराम","सामान्यतः 8 घंटे प्रतिदिन और 40 घंटे प्रति सप्ताह। 30 मिनट से 2 घंटे का विराम; सामान्यतः 11 घंटे दैनिक आराम। अनिवार्य साप्ताहिक आराम। वास्तविक काम के घंटे दर्ज होने चाहिए।"],["अतिरिक्त काम","वर्ष में 100 घंटे तक पहली अतिरिक्त घंटे पर +25%, बाद के घंटों पर +37.5%; साप्ताहिक आराम या छुट्टी के दिन प्रति घंटे +50%। 100 घंटे से अधिक होने पर क्रमशः +50%, +75% और +100%। सामान्य सीमा 200 घंटे/वर्ष और सामान्य कार्यदिवस में 2 घंटे, कानूनी अपवादों के अधीन।"],["रात्रि काम और विशेष समय व्यवस्था","रात 8 से सुबह 7 बजे तक +25%। निर्धारित समय से छूट के लिए लिखित समझौता आवश्यक है: सामान्य समय सीमा से मुक्त व्यवस्था में न्यूनतम वेतन का 25%, अन्य व्यवस्थाओं में 5–10%, कानूनी सुरक्षा के अधीन। लचीली समय व्यवस्था और समय बैंक के लिए कानूनी शर्तें और मुआवजा आवश्यक हैं।"],["छुट्टियाँ और भत्ते","प्रति वर्ष 22 कार्यदिवस सवेतन छुट्टी; उपस्थिति के आध
