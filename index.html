la ETT y supervisa la resolución.\n• Fuera del contrato comercial: informar de los recursos legales y oficiales, incluida ACT, y derivar al empleador directo cuando proceda, sin divulgar la identidad sin fundamento legítimo. Supervisar las obligaciones propias de Finca Tropic.\n\nV. REGISTRO Y ARCHIVO\nLa representante del empleador mantiene el registro privado de las comunicaciones, acciones correctivas y seguimiento. Las comunicaciones digitales se registran automáticamente; las demás, manualmente. Las pruebas se identifican y archivan por separado.\n• Conservación: conservar el resumen de las reclamaciones durante al menos 24 meses. Revisar la necesidad de conservar datos personales adicionales y eliminar los que dejen de ser necesarios, sin perjuicio de las obligaciones legales o procedimientos pendientes.\n\nContenido mínimo del registro\nEl registro debe permitir seguir la recepción, la tramitación y la decisión, incluyendo:\n• Número de registro y fecha de recepción.\n• Descripción de la queja (o asunto, si es verbal o se resuelve inmediatamente).\n• Identificación solo cuando sea voluntaria y necesaria; indicación de anonimato.\n• Acción correctiva/resolución final y decisión.\n• Tiempo de resolución.\n• Prueba de comunicación de la decisión (fecha de publicación en la aplicación, aviso general u otro medio); no dar por hecho que se ha leído la respuesta.\n\nVI. CONFIDENCIALIDAD, SEGUIMIENTO Y APROBACIÓN\nLas notificaciones digitales se envían a la representante del empleador (Marta Martins), a los técnicos Gonçalo Ramires y Alexandre Loução y a la directora de RR. HH. (D. González). Los cuatro reciben el contenido de la comunicación; solo las personas autorizadas consultan el registro privado. No reenviar indiscriminadamente ni utilizar la información para represalias. Si la queja implica a un destinatario, este no debe participar en la investigación o decisión; el trabajador puede utilizar directamente el canal independiente.\nPrivacidad: la aplicación no solicita autenticación ni recoge deliberadamente la dirección IP o la ubicación. Los servicios de alojamiento pueden conservar registros técnicos. El trabajador debe evitar información identificativa si desea anonimato. El código privado se almacena como hash y no se envía en las notificaciones. Los datos se tratan para gestionar la comunicación y cumplir las obligaciones aplicables; las solicitudes relativas a derechos de protección de datos pueden dirigirse a la empresa mediante mmartins@perseagrowers.com.\nSeguimiento: registrar las comprobaciones de funcionamiento, incluso cuando no existan reclamaciones. Si el formulario no está disponible, derivar al representante de los trabajadores o a ACT. No crear reclamaciones ficticias como prueba de uso real.\nEntrada en vigor: tras la aprobación de la dirección, la validación de la información de privacidad y la divulgación a los trabajadores y las ETT, activar el modo de producción. La versión de 2025 permanece archivada.\nReferencia: GLOBALG.A.P. GRASP v2.0_Sep22, sección 3, criterios 3.1 a 3.7 (páginas 12–19)."],["Código de Buena Conducta — Prevención del Acoso — revisión 1","1. Objetivo y ámbito\nFinca Tropic I, S.A. y Extraissol, Lda. adoptan una política de tolerancia cero frente al acoso, la violencia y la discriminación. Este código se aplica a trabajadores directos, temporales, mandos, dirección, prestadores de servicios y visitantes, en las explotaciones y en las relaciones profesionales, incluidas las comunicaciones digitales.\n\n2. ¿Qué es el acoso?\nEs un comportamiento no deseado que tiene por objeto o efecto perturbar o coaccionar a una persona, afectar a su dignidad o crear un entorno intimidatorio, hostil, degradante, humillante o desestabilizador. El acoso sexual implica conductas no deseadas de carácter sexual, verbales, no verbales o físicas. La valoración depende de los hechos y el contexto.\n\n3. Conductas prohibidas\nInsultos, amenazas, humillaciones, intimidación, aislamiento abusivo, comentarios discriminatorios, contactos físicos no deseados, propuestas sexuales no deseadas o presión para obtener favores sexuales. También se prohíbe cualquier represalia. La gestión legítima del trabajo, ejercida con respeto y proporcionalidad, no constituye por sí sola acoso.\n\n4. Prevención y responsabilidades\nLos mandos deben promover relaciones respetuosas, intervenir ante conductas inadecuadas y comunicar situaciones de riesgo. Todos deben respetar a sus compañeros, colaborar en el esclarecimiento de los hechos y mantener la confidencialidad. La empresa garantiza la divulgación y la información en un lenguaje comprensible, incluidas las ETT.\n\n5. Cómo comunicar\nCualquier persona afectada o testigo puede comunicar los hechos verbalmente o por escrito, incluso de forma anónima, en el Portal A Tua Voz: https://perseagrowers.github.io/a-tua-voz/. También puede contactar con el representante de los trabajadores, Recursos Humanos o directamente con ACT (300 069 300) y CITE (800 204 684), sin autorización previa. Si un destinatario está implicado, debe recurrir a un canal independiente. Ante peligro inmediato, llamar al 112.\n\n6. Tramitación, protección y consecuencias\nCada empleador inicia un procedimiento disciplinario cuando tiene conocimiento de presuntas situaciones de acoso laboral, conforme a la ley. La investigación debe ser rápida, imparcial y reservada, apartando a las personas con conflictos de intereses, protegiendo adecuadamente a las personas y respetando el derecho de contradicción. En casos de ETT, se coordina con el empleador competente. Los hechos probados pueden dar lugar a sanciones legales proporcionales, sin perjuicio de otras responsabilidades. No habrá represalias por comunicaciones de buena fe; denunciantes y testigos gozan de la protección del artículo 29, apartado 6, del Código del Trabajo. El acceso a los registros se limita a quienes los necesiten.\n\n7. Divulgación y revisión\nEl código se divulgará en el Portal del Trabajador tras la aprobación por ambas empresas, se explicará en la incorporación y se revisará ante cambios legales o necesidades identificadas.\nReferencias: Código del Trabajo, artículos 29, 127, apartado 1, letras k) y l), y 283; Ley 73/2017; Política de Derechos Humanos y Procedimiento de Reclamaciones."],["Procedimiento Disciplinario — revisión 1","1. Objetivo y ámbito\nGarantizar una tramitación justa, proporcional y confidencial de las posibles infracciones disciplinarias en Finca Tropic I, S.A. y Extraissol, Lda. El procedimiento se aplica a los trabajadores directos. En cuanto a los trabajadores temporales o subcontratados, los hechos se comunican a su empleador, a quien corresponde ejercer la potestad disciplinaria.\n\n2. Conductas y prevención\nEl incumplimiento culpable de los deberes laborales, en particular las normas de seguridad, respeto a los compañeros, asistencia e instrucciones legítimas, puede ser objeto de evaluación disciplinaria. Se prioriza la aclaración y orientación cuando proceda, sin perjuicio de la obligación legal de iniciar un procedimiento ante presuntas situaciones de acoso.\n\n3. Tramitación y derecho de defensa\nEl mando comunica los hechos a Recursos Humanos o a la dirección del empleador. Se registran los hechos, se recogen las pruebas y se escucha a las personas pertinentes, evitando conflictos de intereses. Se informa al trabajador de los hechos que se le imputan y se le ofrece una oportunidad efectiva de defenderse antes de cualquier sanción. Se respetan los plazos legales, la confidencialidad y los procedimientos especiales, incluidos los previstos para un eventual despido por justa causa.\n\n4. Decisión y medidas disciplinarias\nLa decisión corresponde al empleador o a quien tenga poderes delegados. Toda sanción debe ser legal, motivada y proporcional a la gravedad de la infracción y a la culpabilidad; no puede aplicarse más de una sanción por la misma infracción. Pueden aplicarse amonestaciones o amonestaciones registradas y, en situaciones graves, otras medidas legalmente admisibles compatibles con GRASP. Se prohíben los descuentos salariales como medida disciplinaria. No se aplican multas disciplinarias ni suspensión con pérdida de remuneración.\n\n5. Garantías y reclamaciones\nSe prohíben los castigos físicos, humillaciones, discriminación, intimidación y represalias por ejercer derechos, presentar reclamaciones legítimas o realizar actividad sindical. El trabajador puede impugnar la decisión por los medios legales y buscar apoyo del representante de los trabajadores, sindicato o ACT, sin autorización de la empresa. Portal: https://perseagrowers.github.io/a-tua-voz/.\n\n6. Registros y seguimiento\nLos procedimientos y sanciones aplicados se registran y conservan en archivo reservado, con acceso limitado a los responsables autorizados, conforme a la ley. Se mantiene actualizado el registro de sanciones (art. 332 del Código del Trabajo). La inexistencia de procedimientos no exime de divulgar el procedimiento.\n\n7. Divulgación y referencias\nTras su aprobación, el procedimiento se comunica a los trabajadores y a las ETT en un idioma comprensible, incluido el Portal del Trabajador.\nReferencias: Código del Trabajo, arts. 127, 328–332 y 351–358; CCT AHSA–SETAAB aplicable; GRASP v2, criterios 13.1 y 13.2."],["Comunicación interna — Evaluación GRASP 2026","EVALUACIÓN GRASP 2026 — INFORMACIÓN A LOS TRABAJADORES\nFinca Tropic I, S.A. y Extraissol, Lda. informan a los trabajadores directos y subcontratados sobre la próxima evaluación GLOBALG.A.P. Risk Assessment on Social Practice (GRASP), relativa a las prácticas sociales y las condiciones de trabajo.\n\n1. ¿Qué se evaluará?\nLa evaluación abarca la libertad de asociación, representación de los trabajadores, reclamaciones, derechos humanos, condiciones de empleo, salarios, horarios, descansos, protección de menores y procedimientos disciplinarios.\n\n2. Participación de los trabajadores\nLos trabajadores pueden ser invitados a conversar con el evaluador. Pueden responder libremente y con sinceridad, sin interferencia de la empresa ni temor a represalias. También pueden contactar con José Albino, representante de los trabajadores, durante el horario laboral.\n\n3. ¿Dónde consultar la información?\nPortal del Trabajador — A Tua Voz\nhttps://perseagrowers.github.io/a-tua-voz/\nEl portal es accesible mediante el código QR divulgado en las explotaciones y dispone de interfaz en portugués, inglés, español, nepalí e hindi. Incluye derechos laborales, contactos de apoyo y el canal de reclamaciones y sugerencias. Las políticas aprobadas se pondrán a disposición progresivamente. La documentación aplicable también puede consultarse con el representante o la administración.\n\n4. Reclamaciones y apoyo independiente\nPuedes presentar una reclamación o sugerencia, con o sin identificación, y consultar la respuesta mediante el código privado. También puedes acudir directamente a ACT (300 069 300) u otras entidades de apoyo, sin autorización de la empresa.\nLa información se comunicará a los trabajadores en un idioma que comprendan, incluidos los trabajadores de las ETT."],["Instrucción del Representante GRASP","Objetivo y ámbito\nRepresentante: José Albino (sujeto a confirmación por los trabajadores en el ciclo 2026).\nEntidad: Finca Tropic I, S.A. Abarca trabajadores directos y subcontratados.\n\nFunciones, derechos y responsabilidades\n• Escuchar a los trabajadores, recoger sus preocupaciones y transmitir propuestas a la empresa, sin discriminación.\n• Participar en la evaluación GRASP, apoyar la comunicación de los derechos laborales y supervisar las acciones correctivas.\n• Promover reuniones mensuales durante el período de mayor presencia de trabajadores, con participación de los trabajadores y la empresa, y documentar los asuntos y decisiones.\n• Ayudar a presentar reclamaciones, incluidas las verbales y anónimas, sin revelar la identidad sin autorización. Conocer el procedimiento y supervisar la resolución.\n• Tener acceso a los trabajadores, tiempo y lugar adecuados para ejercer las funciones, sin interferencias ni represalias.\n• Informar sobre los canales independientes, incluidos ACT y sindicatos; no impedir el acceso directo a dichos canales.\nPortal: https://perseagrowers.github.io/a-tua-voz/ — permite presentar reclamaciones y consultar respuestas mediante un código privado. No solicitar códigos privados a los trabajadores."],["Declaración de compromiso de socios y ETT — revisión 2","II. COMPROMISO Y RECONOCIMIENTO\nFinca Tropic I, S.A. pone a disposición de la entidad socia identificada los documentos indicados anteriormente. La firma confirma su recepción y el compromiso de aplicarlos en las actividades contratadas.\nEl representante de la entidad socia confirma haber recibido y comprendido los siguientes compromisos:\n\nA. Para TODOS los subcontratistas y visitantes (tolerancia cero)\nLa entidad socia reconoce la política de tolerancia cero respecto a vulneraciones de los derechos humanos y de la legislación laboral y social aplicable.\nEl socio se compromete a:\n1. Cumplir íntegramente todas las leyes locales y nacionales mientras se encuentre en las instalaciones de Finca Tropic I, S.A.\n2. Garantizar que sus colaboradores/representantes presentes en la explotación cumplan las normas de conducta y respeten los derechos humanos.\n\nB. Para subcontratistas de mano de obra (obligatorio)\nLa entidad proveedora de mano de obra se compromete a:\n1. Poner la política y el procedimiento a disposición de sus trabajadores y explicárselos en un idioma que comprendan, antes del comienzo de la actividad o, para los trabajadores actuales, tras recibir esta revisión.\n2. Divulgar el portal Persea — A Tua Voz (https://perseagrowers.github.io/a-tua-voz/), incluido el código QR, el envío anónimo o identificado y la consulta privada de respuestas. Informar sobre el acceso directo al representante de los trabajadores y a ACT.\n3. Garantizar la ausencia de represalias, cumplir las obligaciones laborales y facilitar pruebas de conformidad para su verificación, respetando la protección de datos personales.\n\nIII. RECONOCIMIENTO DOCUMENTAL\nMediante la firma, las partes confirman la comunicación y recepción de los documentos en la fecha indicada. La entidad socia se compromete a divulgar las actualizaciones entre sus trabajadores y a cooperar en la resolución de posibles no conformidades."],["Declaración de Conocimiento y Comprensión — GRASP","Cada trabajador confirma, mediante firma, que ha recibido o consultado la información siguiente, que se le ha explicado en un idioma que comprende y que ha tenido oportunidad de aclarar dudas:\n• Política de Derechos Humanos y Política de Libertad de Asociación;\n• Código de Buena Conducta y prevención del acoso; procedimiento disciplinario;\n• Guía de Derechos Laborales 2026 y comunicación de la evaluación GRASP;\n• Procedimiento de reclamaciones, anonimato, ausencia de represalias y apoyo externo;\n• Portal del Trabajador: acceso, selección de idioma y consulta mediante código privado.\nPortal: https://perseagrowers.github.io/a-tua-voz/\nLa firma confirma la información efectivamente comunicada y no constituye renuncia a derechos."],["Guía de Derechos Laborales — 2026","1. Remuneraciones mínimas — 2026\nInformación para trabajadores directos y temporales de Finca Tropic I, S.A. y Extraissol, Lda.\nImportes brutos mensuales a tiempo completo, cuando estén cubiertos por el CCT AHSA–SETAAB. El mínimo nacional en Portugal continental es de 920 €; el nivel 11 del CCT corresponde a 925 € (SMN + 5 €).\nNivel — categoría profesional — mínimo:\n1. Director general — 1 480 €\n2. Director de servicios — 1 250 €\n3. Gestor de área; técnico oficial de cuentas — 1 200 €\n4. Técnico superior o especialista de área — 1 100 €\n5. Asistente de producción; coordinador de área — 1 060 €\n6. Técnico de área — 1 050 €\n7. Encargado de almacén; secretario de dirección — 1 030 €\n8. Asistente administrativo; supervisor de área; auxiliar de técnico de mantenimiento — 985 €\n9. Jefe de equipo — 960 €\n10. Operador de maquinaria agrícola; aplicador de fitosanitarios y fertilizantes; apuntador; asistente de supervisión; conductor — 950 €\n11. Empleado de almacén; guarda de finca; operador de limpieza industrial, de línea de producción o de riego; trabajador agrícola; ayudante de almacén; trabajador auxiliar — 925 €\nFuente: anexo III, tabla B, rectificación en BTE 15/2025, p. 160; DL 139/2025. La categoría debe corresponder a las funciones desempeñadas. La remuneración variable o a destajo no elimina el mínimo aplicable (cl. 57).\n\n2. Pago y complementos\nRecibe un recibo desglosado con salario, complementos, deducciones y valor neto. El pago se debe en el mes correspondiente; el CCT prevé el pago hasta el día 10 del mes siguiente si existe consentimiento expreso en el contrato o adenda (cl. 59). Alimentación: 6 € por día efectivamente trabajado, cuando se supere la mitad del período normal diario (cl. 66).\n\n3. Horarios, pausas y descansos\nRegla normal: 8 h/día y 40 h/semana, distribuidas de lunes a sábado. Pausa de 30 minutos a 2 horas; normalmente no más de 5 h consecutivas (6 h si el período diario supera 10 h). Descanso diario, por regla general, de 11 horas consecutivas. Descanso semanal obligatorio el sábado o domingo, pudiendo cambiar durante la campaña. Registrar las horas efectivas, incluidas entradas, salidas y pausas. (CCT cl. 18, 25, 26 y 36; CT art. 202).\n\n4. Trabajo extraordinario (horas extra)\nDebe existir un motivo legal y registro. Límites generales del CCT: 200 h/año y 2 h en día normal, salvo fuerza mayor y demás límites legales; a tiempo parcial se aplica la proporcionalidad de la cláusula 31. Puedes solicitar dispensa por motivo atendible. No se admite trabajo coercitivo.\nIncremento sobre la hora normal — hasta 100 h/año / más de 100 h/año:\n• Día laborable — primera hora: 25% / 50%.\n• Día laborable — horas siguientes: 37,5% / 75%.\n• Descanso semanal o festivo — cada hora: 50% / 100%.\nLos importes por cada hora de descanso o festivo se derivan del art. 268 del CT, que prevalece sobre la redacción menos favorable. El trabajo durante el descanso semanal obligatorio da derecho a un día de descanso compensatorio remunerado en uno de los tres días laborables siguientes. (CCT cl. 28–33, 60).\n\n5. Trabajo nocturno, exención de horario y adaptabilidad\nTrabajo nocturno: 20 h–7 h, con incremento del 25% (cl. 34 y 67). Exención de horario: exige acuerdo escrito y modalidad legal; la cl. 62 prevé el 25% de la remuneración mínima por no estar sujeto a los límites normales y el 5–10% en las demás situaciones, sin perjuicio de las garantías legales aplicables. El descanso semanal y los festivos no quedan incluidos en la exención a efectos del pago de horas extra.\nAdaptabilidad (cl. 19): hasta 2 h/día adicionales y 50 h/semana, con promedio del período normal en seis meses y compensación equivalente. El horario debe comunicarse con 15 días de antelación y previa consulta a SETAAB. Banco de horas solo cuando se establezca legalmente, con registros y compensaciones propios (cl. 21). No confundir con horas extra.\n\n6. Vacaciones y festivos\n22 días laborables anuales; el CCT prevé 2 días adicionales hasta dos ausencias justificadas (o cuatro medias jornadas), o 1 día adicional hasta tres ausencias (o seis medias jornadas), incluida la condición de asistencia de la cl. 40. En el año de incorporación: 2 días laborables por mes, hasta 20, por regla general tras seis meses. Vacaciones pagadas y subsidio de vacaciones; subsidio de Navidad equivalente a un mes de remuneración, proporcional cuando proceda. El Carnaval y el festivo municipal también están previstos en el CCT. (cl. 37, 39–42, 63–64).\n\n7. Ausencias, enfermedad, parentalidad y protección social\nComunica las ausencias al empleador y entrega justificante cuando se exija. Las ausencias justificadas no son necesariamente remuneradas. La enfermedad puede dar acceso a una prestación de la Seguridad Social, según las condiciones legales. Padres y madres tienen derecho a permisos, dispensas y protección especial conforme al Código del Trabajo y al régimen de Seguridad Social. Consulta seg-social.pt y cite.gov.pt para condiciones específicas. (CT arts. 33–65, 248–257).\n\n8. Formación y condiciones de empleo\nDerecho a 40 horas anuales de formación continua; contratos temporales de tres meses o más: proporcional. Formación certificada y crédito conforme a la ley (CCT cl. 7–9; CT arts. 131–132). Derecho a información escrita sobre condiciones de empleo, función, horario, remuneración, vacaciones e instrumento colectivo aplicable (CT arts. 106–107).\n\n9. Trabajadores temporales y migrantes\nLos trabajadores de ETT tienen derecho a las condiciones de trabajo y a la remuneración más favorable prevista en el art. 185 del CT, incluidos los mínimos aplicables a la función. Deben recibir información comprensible, acceder a los canales de apoyo y poder presentar reclamaciones. No se permite retener documentos personales ni imponer trabajo forzoso.\n\n10. Igualdad, seguridad y representación\nIgualdad de trato y remuneración por trabajo de igual valor; prohibición de discriminación, acoso y represalias. Derecho a afiliarse o no a sindicatos y elegir representantes. Derecho a condiciones seguras, información, formación y EPI adecuados sin coste, y a comunicar peligros. (CT arts. 23–29, 127, 281, 440; Ley 102/2009).\n\n11. Reclamaciones y contactos\nPortal A Tua Voz: https://perseagrowers.github.io/a-tua-voz/ — reclamaciones y sugerencias, con identificación opcional y consulta mediante código privado. También puedes contactar con José Albino, representante de los trabajadores, o directamente con ACT (300 069 300), SETAAB (213 931 200 / 937 955 329), CITE (800 204 684) o Seguridad Social (300 502 502).\nEmergencia: 112.\n\nFuentes y control de actualización\nCCT AHSA–SETAAB, BTE 11/2025, pp. 17–54:\nhttps://bte.dgcp.mtsss.gov.pt/completos/2025/bte11_2025.pdf\nRectificación BTE 15/2025, pp. 159–160; Portaria 388/2025/1, de 12/11; Código del Trabajo (Ley 7/2009, redacción vigente); DL 139/2025. Información revisada el 24/11/2026. Guía informativa: no sustituye la ley ni las condiciones más favorables. Revisar en enero de 2027 o cuando haya cambios legales."]];const fullGraspEN=[["Human Rights Protection Policy — revision 2","1. Fundamental commitment and general compliance\nFinca Tropic I, S.A. undertakes to protect, promote and respect the human and labour rights of all workers, including permanent, temporary, migrant and subcontracted workers, in conditions of dignity, fairness, equality, respect and independence, within the GRASP v2 framework.\n• UN Guiding Principles (UNGPs): commitment to respecting human rights as set out in the United Nations Guiding Principles on Business and Human Rights.\n• Applicable legislation: comply with Portuguese legislation, including the Labour Code, applicable collective regulations and occupational health and safety standards.\n• Statement of principle: the company adopts a clear policy of not causing, contributing to or being associated with any violations of human rights, actively promoting decent, safe and equitable working conditions.\n\n2. Labour and conduct commitments (ILO Fundamental Conventions)\nIn accordance with our commitment and in full compliance with the ILO Fundamental Conventions, Finca Tropic I, S.A. establishes the following guarantees and prohibitions:\n• Forced labour: prohibit forced labour, debt bondage, coercion, retention of personal documents and recruitment practices restricting workers' freedom. (ILO C29, C105, R35)\n• Child and young workers: prohibit child labour, verify the legal minimum age and take action on any identified situation. Protect workers under 18, where legally employed, from hazardous tasks and night work, without prejudice to their schooling. (ILO C138, R146, C182, R190)\n• Discrimination and equality: all forms of discrimination in employment and occupational practices are prohibited and will not be tolerated. Equal opportunities and treatment are guaranteed, ensuring equal pay for work of equal value. (ILO C100, C111, R90, R111)\n• Freedom of association and collective bargaining: workers are guaranteed the right to organise, join representative bodies and participate in collective bargaining without interference or retaliation. (ILO C87, C98)\n• Working conditions and safety: safe, decent and hygienic working conditions are ensured through risk assessments and adequate training, under a labour inspection system. The company contributes to active policies promoting full employment. (ILO C81, C122)\n• Harassment and abuse: the use or threat of corporal punishment, mental or physical coercion, bullying, harassment or abuse of any kind is not tolerated.\n• Corruption: the company prohibits any involvement in corruption, extortion, embezzlement and any form of bribery, directly or indirectly.\n• Remuneration: guarantee the statutory or collectively agreed minimum wage applicable to the occupational category, whichever is higher, including piecework; pay wages, supplements and benefits due on time and provide itemised payslips.\n• Working time: record actual start and finish times and breaks, retain records for at least five years and comply with legal limits, rest periods, holidays and overtime rules, including overtime pay. Do not resort to coercive overtime.\n• Leave and social protection: respect rights to holidays, parental leave, sickness and other statutory absences and benefits, without discrimination or retaliation.\n• Discipline and well-being: apply lawful and fair disciplinary procedures, with the right to a defence and without disciplinary wage deductions prohibited by GRASP. Where accommodation and transport are provided, they must comply with legal requirements for safety and dignity.\n\n3. Responsibility and grievance management\n• Confidential grievance process: all workers may submit complaints and suggestions, including anonymously, through the Persea — A Tua Voz web app (https://perseagrowers.github.io/a-tua-voz/), contact the workers' or employer's representative, or approach ACT and other competent authorities directly. Any retaliation is prohibited. Communications are handled promptly in accordance with the current Complaints and Grievance Management Procedure, with restricted access to data and the possibility of checking the response using a private code.\n• Due diligence and continuous improvement: identify human rights risks, verify labour practices, investigate reported situations, correct non-compliance and monitor the effectiveness of measures adopted.\n\n4. Business partners and non-conformity\n• Partners: communicate this policy to temporary employment agencies and other agricultural labour providers, require compliance with the same commitments and verify employment conditions, remuneration, working hours and lawful recruitment. Inform other subcontractors and visitors of zero tolerance for human rights violations.\n• Communication: make the policy available to direct and subcontracted workers and explain it in a language they understand, inform all supervisors and retain appropriate evidence of this communication.\n• Review: review the policy at least every three years, or sooner if there are relevant changes to labour legislation or GRASP, whichever occurs first.\n• Non-conformity: the company accepts that if a GRASP assessment check demonstrates any violation of this policy, it will be considered a non-conformity with this Principle and Criterion (P&C)."],["Freedom of Association, Organisation and Representation Policy — revision 2","I. COMMITMENT AND FUNDAMENTAL PRINCIPLES\nFinca Tropic I, S.A. is firmly committed to respecting and protecting the human and labour rights of all its staff, including permanent, temporary and subcontracted workers. We recognise the inalienable right of all individuals to freedom of association and organisation, as established in the Constitution of the Portuguese Republic and the Labour Code.\n\nOur statement:\n• Trade union freedom: Finca Tropic I, S.A. recognises the right of all workers to form, join or participate in trade unions or other workers' organisations of their choice, as well as to decline to join or participate, without company interference.\n• Collective bargaining: we respect the right to collective bargaining and undertake to engage in good faith with lawfully elected representatives.\n• Application: this policy applies to all areas and workplaces managed by Finca Tropic I, S.A.\n\nII. GUARANTEE OF WORKER REPRESENTATION AND VOICE\nTo ensure that workers' voices are heard and considered by management in all labour matters, we implement the following mechanisms:\n\n1. Representation and point of contact\n• José Albino is the representative elected in 2024 for occupational health and safety. His continuation as GRASP representative depends on the free decision of the current workers in each year or production cycle, to be documented separately.\n• The workers' representative, José Albino, acts as the main link between the workforce and management on matters relating to working conditions, safety and well-being.\n• Workers are informed of the representative's name, role and how to contact him during working hours, in accessible locations and on the Worker Portal, without disclosing personal contact details without authorisation.\n\n2. Support for the representative's role\n• Management undertakes to support the representative chosen by the workers, respecting their independence.\n• The representative has access to workers, appropriate time and a suitable place to perform their duties. Trade union representatives and other legally recognised representative bodies are also allowed access to the workplace in accordance with applicable legislation.\n\n3. Information and rights\n• All workers are informed of their right to establish workers' committees and trade unions, to join or not join them and to exercise representation rights (Labour Code, Article 440). Relevant trade union contacts are made available to the representative and the workers.\n• Information is communicated upon recruitment and whenever necessary, in a language understood by the worker, including Portuguese, English, Spanish, Nepali and Hindi, with verbal support where necessary.\n\n4. Prohibition of retaliation and discrimination\n• Finca Tropic I, S.A. prohibits discrimination, intimidation or retaliation on the grounds of trade union membership or non-membership, representative activity, candidacy or performance of representative duties.\n• No worker will be disadvantaged or have their pay, working hours or position jeopardised for exercising their rights of representation or association.\n• Any violation may be reported confidentially, including anonymously, through the Worker Portal — A Tua Voz (https://perseagrowers.github.io/a-tua-voz/), to the workers' representative or directly to ACT or a trade union, without prior company authorisation and without retaliation.\n\nIII. APPROVAL AND COMMUNICATION\nFinca Tropic I, S.A. undertakes to communicate and implement this policy among all workers, including subcontracted workers. The approved version will be made available on the Worker Portal, without prejudice to in-person communication and statutory posting requirements."],["Complaints and Grievance Management Procedure — revision 2","I. STATEMENT OF PRINCIPLES AND GUARANTEES\nFinca Tropic I, S.A. guarantees all workers, permanent, temporary and subcontracted, access to a confidential complaints and suggestions process, without retaliation, penalties or prejudice to their right to approach the authorities and courts.\n• Accessibility and simplicity: information is provided in Portuguese, English, Spanish, Nepali and Hindi. Where necessary, verbal or visual instructions are given in a language understood by the worker.\n• Verbal complaints: these are accepted, including those resolved immediately, with a record of the matter and the person who resolved it. Workers may request anonymity or assistance with submitting a complaint.\n\nII. SUBMISSION CHANNELS AND ACCESSIBILITY\nThe main channel is the Persea — A Tua Voz web app (https://perseagrowers.github.io/a-tua-voz/), accessible via QR code without a Google account. Identification is optional. Personal communication remains an alternative.\nAvailable channels: workers may freely choose any of the following routes, including direct access to an independent channel, without company authorisation.\n\n1. Workers' representative: José Albino — in person or through representation; anonymity on request. Independent of supervision provided that he does not perform supervisory duties.\n2. Authority for Working Conditions (ACT) — external; confidential in accordance with ACT rules. Independent authority.\n3. Direct contact with the employer's representative (Marta Martins) — in person or in writing; anonymity on request. Internal channel, not independent.\n4. Persea — A Tua Voz web app — digital; anonymous by default or identified. Internal channel, not independent.\n\nCommunication and instructions\n• Display instructions and the QR code in accessible places, including rest areas, and publicise external contact details. In the field, the representative or designated person must be accessible to assist with submitting complaints, including anonymous ones. Inform workers of the location of notices and alternative channels.\n• New workers: explain the mechanism during induction, including to temporary employment agencies (ETTs) and their workers. Retain evidence of communication and ensure that the instructions are understood.\n\nIII. ROLE OF WORKER REPRESENTATION (3.3 AND 3.5)\nThe workers' representative (José Albino) must receive documented instructions on the use of the mechanism and the following responsibilities:\n1. Confidentiality: the representative is obliged to keep all information confidential.\n2. Authorisation: the representative may submit a grievance on behalf of another worker only with that worker's express consent (consent document filed, where applicable).\n3. Anonymity: if the representative is asked to act to protect the complainant's anonymity, management must respect the request and ensure that it does not affect the outcome of the grievance.\n4. Notification: the employer's representative informs José Albino of the receipt and outcome of complaints without disclosing the identity or details that could identify the worker.\n5. Support: if the representative cannot act, the worker may seek independent support, including ACT, without going through management. The company provides the necessary contact details.\n\nIV. RESOLUTION AND TIME LIMITS\nThe employer's representative coordinates the assessment, refers matters to the appropriate parties and monitors deadlines. Management and HR ensure that the necessary resources and decisions are provided. Urgent safety matters or risks of retaliation require immediate intervention; in an emergency, call 112.\n\nResolution deadlines\n• Direct employees: aim to complete the assessment and communicate the decision within 30 days, or before the last day of employment if earlier.\n• Subcontracted workers: apply the same 30-day limit or the last day of the service contract if earlier. Manually adjust the automatic spreadsheet deadline where necessary.\n\nHandling the resolution\n1. Response: communicate the reasoned decision, actions taken or the reason why resolution was not possible. Use a language understood by the worker.\n2. Anonymous complaints: in the web app, the worker keeps the private code to check the response. Also publish a general notice of the response in workers' information areas, without names or identifying details. Do not publish sensitive information.\n3. Delays: record the cause, expected completion date and communication to the worker. If the worker voluntarily identified themselves, use the contact provided; if anonymous, make the update available through the appropriate channel.\n\nComplaints from subcontracted workers\n• Within the commercial contract: Finca Tropic investigates conditions on site, coordinates with the temporary employment agency and monitors resolution.\n• Outside the commercial contract: inform workers about legal and official remedies, including ACT, and refer matters to the direct employer where appropriate, without disclosing identity without a legitimate basis. Monitor Finca Tropic's own obligations.\n\nV. RECORDS AND ARCHIVING\nThe employer's representative maintains the private register of communications, corrective actions and monitoring. Digital submissions are recorded automatically; other submissions are recorded manually. Tests are identified and archived separately.\n• Retention: retain the summary of complaints for at least 24 months. Review the need to retain additional personal data and delete data that is no longer necessary, without prejudice to legal obligations or pending proceedings.\n\nMinimum register content\nThe register must allow receipt, handling and decisions to be monitored, including:\n• Registration number and date of receipt.\n• Description of the grievance (or subject, if verbal or immediately resolved).\n• Identification only where voluntary and necessary; indication of anonymity.\n• Corrective action/final resolution and decision.\n• Resolution time.\n• Evidence that the decision was communicated (date made available in the web app, general notice or other means); do not assume that the response has been read.\n\nVI. CONFIDENTIALITY, MONITORING AND APPROVAL\nDigital notifications are sent to the employer's representative (Marta Martins), the technical staff Gonçalo Ramires and Alexandre Loução, and the HR Director (D. González). All four receive the content of the communication; only authorised persons may consult the private register. Do not forward information indiscriminately or use it for retaliation. If a complaint involves one of the recipients, that person must not participate in the investigation or decision; the worker may use the independent channel directly.\nPrivacy: the web app does not require authentication or deliberately collect IP addresses or location. Hosting services may retain technical logs. Workers should avoid identifying information if they wish to remain anonymous. The private code is stored as a hash and is not sent in notifications. Data is processed to manage the communication and fulfil applicable obligations; data protection rights requests may be addressed to the company at mmartins@perseagrowers.com.\nMonitoring: record operational checks, including when no complaints have been received. If the form is unavailable, refer workers to the workers' representative or ACT. Do not create fictitious complaints as evidence of actual use.\nEntry into force: after management approval, validation of privacy information and communication to workers and temporary employment agencies, activate production mode. The 2025 version remains archived.\nReference: GLOBALG.A.P. GRASP v2.0_Sep22, section 3, criteria 3.1 to 3.7 (pages 12–19)."],["Code of Good Conduct — Prevention of Harassment — revision 1","1. Purpose and scope\nFinca Tropic I, S.A. and Extraissol, Lda. adopt a zero-tolerance policy towards harassment, violence and discrimination. This code applies to direct employees, temporary workers, supervisors, management, service providers and visitors, on the farms and in professional relationships, including digital communications.\n\n2. What is harassment?\nHarassment is unwanted behaviour intended to or having the effect of disturbing or constraining a person, affecting their dignity or creating an intimidating, hostile, degrading, humiliating or destabilising environment. Sexual harassment involves unwanted conduct of a sexual nature, whether verbal, non-verbal or physical. Assessment depends on the facts and context.\n\n3. Prohibited conduct\nInsults, threats, humiliation, intimidation, abusive isolation, discriminatory comments, unwanted physical contact, unwanted sexual propositions or pressure to obtain sexual favours. Any retaliation is also prohibited. Legitimate management of work, exercised with respect and proportionality, does not in itself constitute harassment.\n\n4. Prevention and responsibilities\nSupervisors must promote respectful relationships, intervene in cases of inappropriate conduct and report risk situations. Everyone must respect colleagues, cooperate in establishing the facts and maintain confidentiality. The company ensures communication and information in understandable language, including to temporary employment agencies.\n\n5. How to report\nAny affected person or witness may report verbally or in writing, including anonymously, through the A Tua Voz Portal: https://perseagrowers.github.io/a-tua-voz/. They may also contact the workers' representative, Human Resources or directly ACT (300 069 300) and CITE (800 204 684), without prior authorisation. If a recipient is involved, use an independent channel. In immediate danger, call 112.\n\n6. Handling, protection and consequences\nEach employer initiates disciplinary proceedings when it becomes aware of alleged workplace harassment, in accordance with the law. The investigation must be prompt, impartial and confidential, excluding parties with conflicts of interest, adequately protecting individuals and respecting the right to respond to allegations. In cases involving temporary employment agencies, coordination takes place with the competent employer. Proven facts may lead to proportionate lawful sanctions, without prejudice to other liabilities. There is no retaliation for good-faith reports; complainants and witnesses benefit from the protection of Article 29(6) of the Labour Code. Access to records is limited to those who need them.\n\n7. Communication and review\nThe code will be communicated on the Worker Portal after approval by both companies, explained on recruitment and reviewed in the event of legal changes or identified needs.\nReferences: Labour Code, Articles 29, 127(1)(k) and (l), and 283; Law 73/2017; Human Rights Policy and Complaints Procedure."],["Disciplinary Procedure — revision 1","1. Purpose and scope\nEnsure fair, proportionate and confidential handling of possible disciplinary breaches at Finca Tropic I, S.A. and Extraissol, Lda. The procedure applies to direct employees. In the case of temporary or subcontracted workers, the facts are communicated to their employer, who has the authority to take disciplinary action.\n\n2. Conduct and prevention\nCulpable failure to comply with employment duties, particularly safety rules, respect for colleagues, attendance and legitimate instructions, may be subject to disciplinary assessment. Clarification and guidance are preferred where appropriate, without prejudice to the legal obligation to initiate proceedings in cases of alleged harassment.\n\n3. Proceedings and right of defence\nThe supervisor reports the facts to HR or the employing entity's management. Facts are recorded, evidence collected and relevant persons heard, avoiding conflicts of interest. The worker is informed of the allegations and given an effective opportunity to defend themselves before any sanction. Legal deadlines, confidentiality and special procedures are respected, including those relating to potential dismissal for just cause.\n\n4. Decisions and disciplinary measures\nThe decision is made by the employer or a person with delegated authority. Any sanction must be lawful, reasoned and proportionate to the seriousness of the breach and culpability; no more than one sanction may be imposed for the same breach. A reprimand or recorded reprimand may be applied and, in serious situations, other legally permissible measures compatible with GRASP. Wage deductions as disciplinary measures are prohibited. No disciplinary fines or suspension with loss of pay are applied.\n\n5. Guarantees and complaints\nPhysical punishment, humiliation, discrimination, intimidation and retaliation for exercising rights, legitimate complaints or trade union activity are prohibited. Workers may challenge the decision by legal means and seek support from the workers' representative, a trade union or ACT without company authorisation. Portal: https://perseagrowers.github.io/a-tua-voz/.\n\n6. Records and monitoring\nProceedings and sanctions are recorded and retained in a confidential archive with access restricted to authorised persons, in accordance with the law. The sanctions register is kept up to date (Labour Code Article 332). The absence of proceedings does not remove the obligation to communicate the procedure.\n\n7. Communication and references\nFollowing approval, the procedure is communicated to workers and temporary employment agencies in an understandable language, including through the Worker Portal.\nReferences: Labour Code, Articles 127, 328–332 and 351–358; applicable AHSA–SETAAB collective agreement; GRASP v2, criteria 13.1 and 13.2."],["Internal communication — GRASP assessment 2026","GRASP ASSESSMENT 2026 — INFORMATION FOR WORKERS\nFinca Tropic I, S.A. and Extraissol, Lda. inform direct and subcontracted workers of the forthcoming GLOBALG.A.P. Risk Assessment on Social Practice (GRASP), concerning social practices and working conditions.\n\n1. What will be assessed?\nThe assessment covers freedom of association, worker representation, complaints, human rights, employment conditions, wages, working hours, rest periods, protection of minors and disciplinary procedures.\n\n2. Worker participation\nWorkers may be invited to speak to the assessor. They may answer freely and honestly, without company interference or fear of retaliation. They may also contact José Albino, the workers' representative, during working hours.\n\n3. Where to find information?\nWorker Portal — A Tua Voz\nhttps://perseagrowers.github.io/a-tua-voz/\nThe portal is accessible via the QR code displayed on the farms and has an interface in Portuguese, English, Spanish, Nepali and Hindi. It includes labour rights, support contacts and the complaints and suggestions channel. Approved policies will be made available progressively. Applicable documentation can also be consulted with the representative or administration.\n\n4. Complaints and independent support\nYou may submit a complaint or suggestion, with or without identification, and check the response using the private code. You may also contact ACT (300 069 300) or other support organisations directly, without company authorisation.\nInformation will be communicated to workers in a language they understand, including temporary agency workers."],["GRASP Representative Instructions","Purpose and scope\nRepresentative: José Albino (subject to confirmation by workers in the 2026 cycle).\nEntity: Finca Tropic I, S.A. Covers direct and subcontracted workers.\n\nDuties, rights and responsibilities\n• Listen to workers, collect concerns and convey proposals to the company without discrimination.\n• Participate in the GRASP assessment, support communication of labour rights and monitor corrective actions.\n• Promote monthly meetings during periods of highest worker presence, including participation by workers and the company, and document matters and decisions.\n• Assist in submitting complaints, including verbal and anonymous complaints, without disclosing identity without authorisation. Know the procedure and monitor resolution.\n• Have access to workers, adequate time and a suitable location to perform duties without interference or retaliation.\n• Inform workers about independent channels, including ACT and trade unions; do not obstruct direct access to these channels.\nPortal: https://perseagrowers.github.io/a-tua-voz/ — enables complaints to be submitted and responses to be checked using a private code. Do not request private codes from workers."],["Commitment statement for partners and temporary employment agencies — revision 2","II. COMMITMENT AND ACKNOWLEDGEMENT\nFinca Tropic I, S.A. makes the above-mentioned documents available to the identified partner entity. The signature confirms receipt and commitment to apply them in the contracted activities.\nThe partner's representative confirms receipt and understanding of the following commitments:\n\nA. For ALL subcontractors and visitors (zero tolerance)\nThe partner acknowledges the zero-tolerance policy regarding violations of human rights and applicable labour and social legislation.\nThe partner undertakes to:\n1. Comply fully with all local and national laws while on the premises of Finca Tropic I, S.A.\n2. Ensure that its staff/representatives present on the farm comply with conduct standards and respect human rights.\n\nB. For labour subcontractors (mandatory)\nThe labour supplier undertakes to:\n1. Make the policy and procedure available to its workers and explain them in a language they understand, before work begins or, for current workers, upon receipt of this revision.\n2. Publicise the Persea — A Tua Voz portal (https://perseagrowers.github.io/a-tua-voz/), including the QR code, anonymous or identified submissions and private checking of responses. Inform workers about direct access to the workers' representative and ACT.\n3. Ensure the absence of retaliation, comply with labour obligations and provide evidence of compliance for verification, respecting personal data protection.\n\nIII. DOCUMENTARY ACKNOWLEDGEMENT\nBy signing, the parties confirm communication and receipt of the documents on the indicated date. The partner undertakes to communicate updates to its workers and cooperate in resolving any non-conformities."],["Declaration of Knowledge and Understanding — GRASP","Each worker confirms by signing that they have received or consulted the information below, that it has been explained in a language they understand and that they have had the opportunity to clarify questions:\n• Human Rights Policy and Freedom of Association Policy;\n• Code of Good Conduct and prevention of harassment; disciplinary procedure;\n• Labour Rights Guide 2026 and communication of the GRASP assessment;\n• Complaints procedure, anonymity, non-retaliation and external support;\n• Worker Portal: access, language selection and checking responses using a private code.\nPortal: https://perseagrowers.github.io/a-tua-voz/\nThe signature confirms the information actually communicated and does not constitute a waiver of rights."],["Labour Rights Guide — 2026","1. Minimum remuneration — 2026\nInformation for direct and temporary workers of Finca Tropic I, S.A. and Extraissol, Lda.\nGross monthly amounts for full-time work when covered by the AHSA–SETAAB collective agreement (CCT). The national minimum in mainland Portugal is €920; level 11 of the CCT corresponds to €925 (national minimum + €5).\nLevel — occupational category — minimum:\n1. General director — €1,480\n2. Services director — €1,250\n3. Area manager; certified accountant — €1,200\n4. Senior technician or area specialist — €1,100\n5. Production assistant; area coordinator — €1,060\n6. Area technician — €1,050\n7. Warehouse manager; executive secretary — €1,030\n8. Administrative assistant; area supervisor; maintenance technician's assistant — €985\n9. Team leader — €960\n10. Agricultural machinery operator; plant protection products and fertiliser applicator; timekeeper; supervision assistant; driver — €950\n11. Warehouse employee; property guard; industrial cleaning, production line or irrigation operator; agricultural worker; warehouse assistant; auxiliary worker — €925\nSource: Annex III, Table B, correction in BTE 15/2025, p. 160; Decree-Law 139/2025. The category must correspond to the duties performed. Variable or piecework remuneration does not eliminate the applicable minimum (clause 57).\n\n2. Payment and allowances\nReceive an itemised payslip showing wages, supplements, deductions and net amount. Payment is due in the relevant month; the CCT allows payment by the 10th of the following month if expressly agreed in the contract or an addendum (clause 59). Meal allowance: €6 per day actually worked when more than half the normal daily working period is completed (clause 66).\n\n3. Working hours, breaks and rest\nNormal rule: 8 h/day and 40 h/week, distributed Monday to Saturday. Break of 30 minutes to 2 hours; normally no more than 5 consecutive hours (6 hours if the daily period exceeds 10 hours). Daily rest generally 11 consecutive hours. Mandatory weekly rest on Saturday or Sunday, which may change during the harvest season. Record actual hours, including start and finish times and breaks. (CCT clauses 18, 25, 26 and 36; Labour Code Article 202.)\n\n4. Overtime\nThere must be a lawful reason and a record. General CCT limits: 200 h/year and 2 h on a normal working day, except force majeure and other statutory limits; part-time work is subject to proportionality under clause 31. You may request exemption for a valid reason. Coercive work is not permitted.\nPremium over normal hourly pay — up to 100 h/year / over 100 h/year:\n• Working day, first hour: 25% / 50%.\n• Working day, subsequent hours: 37.5% / 75%.\n• Weekly rest day or public holiday, each hour: 50% / 100%.\nThe rates for each hour on a rest day or public holiday derive from Labour Code Article 268, which prevails over less favourable wording. Work on the mandatory weekly rest day entitles the worker to one paid compensatory rest day within the next three working days. (CCT clauses 28–33, 60.)\n\n5. Night work, working-time exemption and adaptability\nNight work: 20:00–07:00, with a 25% premium (clauses 34 and 67). Working-time exemption requires written agreement and a lawful arrangement; clause 62 provides 25% of minimum remuneration when not subject to normal limits and 5–10% in other situations, without prejudice to applicable statutory guarantees. Weekly rest and public holidays are not covered by the exemption for overtime payment purposes.\nAdaptability (clause 19): up to 2 additional hours/day and 50 h/week, with the normal working period averaged over six months and equivalent compensation. The schedule must be communicated 15 days in advance and SETAAB consulted beforehand. Time banking only when lawfully established, with its own records and compensation (clause 21). Do not confuse with overtime.\n\n6. Annual leave and public holidays\n22 working days annually; the CCT provides 2 additional days with up to two justified absences (or four half-days), or 1 extra day with up to three absences (or six half-days), including the attendance condition in clause 40. In the year of recruitment: 2 working days per month, up to 20, generally after six months. Paid leave and holiday allowance; Christmas allowance equivalent to one month's remuneration, pro rata where applicable. Carnival and the municipal holiday are also provided for by the CCT. (Clauses 37, 39–42, 63–64.)\n\n7. Absences, sickness, parental rights and social protection\nNotify the employer of absences and provide evidence when required. Justified absences are not necessarily paid. Sickness may entitle workers to Social Security benefits subject to statutory conditions. Parents have rights to leave, exemptions and special protection under the Labour Code and Social Security system. Consult seg-social.pt and cite.gov.pt for specific conditions. (Labour Code Articles 33–65, 248–257.)\n\n8. Training and employment conditions\nRight to 40 hours of continuing training annually; fixed-term contracts of three months or more: proportional entitlement. Certified training and training credits according to the law (CCT clauses 7–9; Labour Code Articles 131–132). Right to written information on employment conditions, duties, working hours, remuneration, holidays and applicable collective agreement (Labour Code Articles 106–107).\n\n9. Temporary and migrant workers\nTemporary agency workers are entitled to working conditions and the more favourable remuneration provided for in Labour Code Article 185, including minima applicable to their role. They must receive understandable information, have access to support channels and be able to submit complaints. Retention of personal documents and forced labour are prohibited.\n\n10. Equality, safety and representation\nEqual treatment and pay for work of equal value; discrimination, harassment and retaliation are prohibited. Right to join or not join trade unions and choose representatives. Right to safe conditions, information, training and suitable PPE free of charge, and to report hazards. (Labour Code Articles 23–29, 127, 281, 440; Law 102/2009.)\n\n11. Complaints and contacts\nA Tua Voz Portal: https://perseagrowers.github.io/a-tua-voz/ — complaints and suggestions, with optional identification and checking via private code. You may also contact José Albino, the workers' representative, or directly ACT (300 069 300), SETAAB (213 931 200 / 937 955 329), CITE (800 204 684) or Social Security (300 502 502).\nEmergency: 112.\n\nSources and update control\nAHSA–SETAAB collective agreement, BTE 11/2025, pp. 17–54:\nhttps://bte.dgcp.mtsss.gov.pt/completos/2025/bte11_2025.pdf\nCorrection BTE 15/2025, pp. 159–160; Ordinance 388/2025/1 of 12/11; Labour Code (Law 7/2009, current wording); Decree-Law 139/2025. Information reviewed on 24/11/2026. Informational guide: does not replace the law or more favourable conditions. Review in January 2027 or when legal changes occur."]];const fullGraspNE=[["मानव अधिकार संरक्षण नीति — संशोधन २","१. आधारभूत प्रतिबद्धता र सामान्य अनुपालन\nFinca Tropic I, S.A. ले GRASP v2 अन्तर्गत स्थायी, अस्थायी, आप्रवासी तथा उपठेक्काका श्रमिकसहित सबै श्रमिकको मानव र श्रम अधिकारलाई मर्यादा, न्याय, समानता, सम्मान र स्वतन्त्रताका साथ संरक्षण, प्रवर्द्धन र सम्मान गर्ने प्रतिबद्धता जनाउँछ।\n• संयुक्त राष्ट्रसंघका मार्गदर्शक सिद्धान्त (UNGPs): व्यवसाय र मानव अधिकारसम्बन्धी संयुक्त राष्ट्रसंघका मार्गदर्शक सिद्धान्तअनुसार मानव अधिकारको सम्मान गर्ने प्रतिबद्धता।\n• लागू कानुन: पोर्चुगलको श्रम संहिता, लागू सामूहिक सम्झौताका नियम तथा कार्यस्थलको सुरक्षा र स्वास्थ्यसम्बन्धी मापदण्डसहित पोर्चुगाली कानुन पालना गर्ने।\n• सिद्धान्तको घोषणा: कम्पनीले मानव अधिकार उल्लङ्घन नगर्ने, त्यसमा योगदान नदिने र त्यस्तो उल्लङ्घनसँग सम्बन्धित नहुने स्पष्ट नीति अपनाउँछ तथा मर्यादित, सुरक्षित र न्यायोचित कामको अवस्था सक्रिय रूपमा प्रवर्द्धन गर्छ।\n\n२. श्रम तथा आचरणसम्बन्धी प्रतिबद्धता (ILO का आधारभूत महासन्धिहरू)\nआफ्नो प्रतिबद्धता र अन्तर्राष्ट्रिय श्रम संगठन (ILO) का आधारभूत महासन्धिहरूको पूर्ण पालनाअनुसार Finca Tropic I, S.A. ले निम्न प्रत्याभूति र निषेधहरू कायम गर्छ:\n• जबरजस्ती श्रम: जबरजस्ती काम, ऋणको बन्धन, दबाब, व्यक्तिगत कागजात नियन्त्रणमा राख्ने तथा श्रमिकको स्वतन्त्रता सीमित गर्ने भर्ती प्रक्रिया निषेध गर्ने। (ILO C29, C105, R35)\n• बाल तथा किशोर श्रम: बालश्रम निषेध गर्ने, कानुनी न्यूनतम उमेर जाँच गर्ने र पत्ता लागेका घटनामा कारबाही गर्ने। कानुनअनुसार नियुक्त १८ वर्षमुनिका श्रमिकलाई खतरनाक काम र रातिको कामबाट संरक्षण गर्ने तथा उनीहरूको शिक्षामा बाधा नपुर्‍याउने। (ILO C138, R146, C182, R190)\n• भेदभाव र समानता: रोजगारी र पेसागत व्यवहारमा सबै प्रकारका भेदभाव निषेध छन् र सहन गरिने छैनन्। समान अवसर र व्यवहार सुनिश्चित गरिन्छ तथा समान मूल्यको कामका लागि समान पारिश्रमिक दिइन्छ। (ILO C100, C111, R90, R111)\n• संघ गठनको स्वतन्त्रता र सामूहिक वार्ता: श्रमिकलाई संगठन बनाउने, प्रतिनिधिमूलक संस्थामा आबद्ध हुने र हस्तक्षेप वा प्रतिशोधबिना सामूहिक वार्तामा भाग लिने अधिकार सुनिश्चित गरिन्छ। (ILO C87, C98)\n• कामको अवस्था र सुरक्षा: जोखिम मूल्याङ्कन र पर्याप्त तालिममार्फत श्रम निरीक्षण प्रणालीअन्तर्गत सुरक्षित, मर्यादित र स्वच्छ कार्य अवस्था सुनिश्चित गरिन्छ। कम्पनी पूर्ण रोजगारी प्रवर्द्धन गर्ने सक्रिय नीतिमा योगदान गर्छ। (ILO C81, C122)\n• उत्पीडन र दुर्व्यवहार: शारीरिक दण्ड, मानसिक वा शारीरिक दबाब, हेपाइ, उत्पीडन वा कुनै प्रकारको दुर्व्यवहार वा त्यसको धम्की सहन गरिँदैन।\n• भ्रष्टाचार: कम्पनीले भ्रष्टाचार, जबरजस्ती असुली, हिनामिना र प्रत्यक्ष वा अप्रत्यक्ष कुनै प्रकारको घुसमा संलग्नता निषेध गर्छ।\n• पारिश्रमिक: कामको वर्गमा लागू कानुनी वा सामूहिक सम्झौताको न्यूनतम तलबमध्ये जुन बढी छ त्यो सुनिश्चित गर्ने, उत्पादनको परिमाणका आधारमा भुक्तानी हुने काममा समेत; देय तलब, थप रकम र सुविधा समयमै भुक्तानी गर्ने तथा विस्तृत तलब पर्ची दिने।\n• कामको समय: काम सुरु र अन्त्य भएको वास्तविक समय र विश्राम अभिलेख गर्ने, अभिलेख कम्तीमा पाँच वर्ष राख्ने तथा कानुनी सीमा, विश्राम, बिदा र अतिरिक्त कामसम्बन्धी नियम, त्यसको पारिश्रमिकसहित, पालना गर्ने। जबरजस्ती अतिरिक्त काम नगराउने।\n• बिदा र सामाजिक संरक्षण: वार्षिक बिदा, मातृत्व/पितृत्व, बिरामी र अन्य कानुनी अनुपस्थिति तथा सुविधाको अधिकार भेदभाव वा प्रतिशोधबिना सम्मान गर्ने।\n• अनुशासन र कल्याण: कानुनी र निष्पक्ष अनुशासनात्मक प्रक्रिया लागू गर्ने, प्रतिरक्षाको अधिकार सुनिश्चित गर्ने र GRASP ले निषेध गरेको अनुशासनात्मक तलब कटौती नगर्ने। आवास र यातायात उपलब्ध गराइएमा सुरक्षा र मर्यादासम्बन्धी कानुनी सर्त पूरा गर्नुपर्छ।\n\n३. जिम्मेवारी र गुनासो व्यवस्थापन\n• गोप्य गुनासो प्रक्रिया: सबै श्रमिकले Persea — A Tua Voz वेब एप (https://perseagrowers.github.io/a-tua-voz/) मार्फत नाम नखुलाई समेत गुनासो र सुझाव दिन, श्रमिक वा रोजगारदाताका प्रतिनिधिलाई सम्पर्क गर्न वा सिधै ACT र अन्य सक्षम निकायमा जान सक्छन्। कुनै पनि प्रतिशोध निषेध छ। लागू गुनासो व्यवस्थापन प्रक्रियाअनुसार समयमै सम्बोधन गरिन्छ, तथ्याङ्कमा पहुँच सीमित हुन्छ र निजी कोडबाट जवाफ हेर्न सकिन्छ।\n• उचित सावधानी र निरन्तर सुधार: मानव अधिकारका जोखिम पहिचान गर्ने, श्रम व्यवहार जाँच गर्ने, रिपोर्ट भएका घटनाको अनुसन्धान गर्ने, उल्लङ्घन सुधार्ने र अपनाइएका उपायको प्रभावकारिता अनुगमन गर्ने।\n\n४. व्यावसायिक साझेदार र गैर-अनुपालन\n• साझेदार: अस्थायी रोजगार एजेन्सी (ETT) र अन्य कृषि श्रमिक आपूर्तिकर्तालाई यो नीति जानकारी दिने, समान प्रतिबद्धता पालना गर्न लगाउने तथा रोजगार अवस्था, पारिश्रमिक, कार्यसमय र भर्तीको वैधता जाँच गर्ने। अन्य उपठेकेदार र आगन्तुकलाई मानव अधिकार उल्लङ्घनप्रति शून्य सहनशीलताबारे जानकारी दिने।\n• सञ्चार: प्रत्यक्ष र उपठेक्काका श्रमिकलाई उनीहरूले बुझ्ने भाषामा नीति उपलब्ध गराउने र बुझाउने, सबै सुपरभाइजरलाई जानकारी दिने तथा सञ्चारका उचित प्रमाण राख्ने।\n• समीक्षा: कम्तीमा प्रत्येक तीन वर्षमा वा श्रम कानुन वा GRASP मा महत्त्वपूर्ण परिवर्तन भएमा त्यसभन्दा अगाडि, जुन पहिले हुन्छ, नीति समीक्षा गर्ने।\n• गैर-अनुपालन: GRASP मूल्याङ्कनको जाँचले यस नीतिको कुनै उल्लङ्घन देखाएमा कम्पनीले यसलाई सम्बन्धित बुँदा र मापदण्ड (P&C) को गैर-अनुपालन मान्ने स्वीकार गर्छ।"],["संघ गठन, संगठन र प्रतिनिधित्वको स्वतन्त्रतासम्बन्धी नीति — संशोधन २","I. प्रतिबद्धता र आधारभूत सिद्धान्त\nFinca Tropic I, S.A. स्थायी, अस्थायी र उपठेक्काका श्रमिकसहित सबै कर्मचारीको मानव र श्रम अधिकारको सम्मान र संरक्षण गर्न दृढ प्रतिबद्ध छ। पोर्चुगलको संविधान र श्रम संहिताअनुसार सबै व्यक्तिको संघ गठन र संगठन गर्ने अहस्तान्तरणीय अधिकारलाई हामी मान्यता दिन्छौँ।\n\nहाम्रो घोषणा:\n• ट्रेड युनियनको स्वतन्त्रता: Finca Tropic I, S.A. सबै श्रमिकको आफूले रोजेको ट्रेड युनियन वा अन्य श्रमिक संगठन स्थापना गर्ने, सदस्य बन्ने वा सहभागी हुने, अथवा सदस्य नबन्ने वा सहभागी नहुने अधिकारलाई कम्पनीको हस्तक्षेपबिना मान्यता दिन्छ।\n• सामूहिक वार्ता: हामी सामूहिक वार्ताको अधिकारको सम्मान गर्छौँ र कानुनी रूपमा निर्वाचित प्रतिनिधिसँग सद्भावपूर्वक व्यवहार गर्ने प्रतिबद्धता जनाउँछौँ।\n• लागू क्षेत्र: यो नीति Finca Tropic I, S.A. द्वारा व्यवस्थापित सबै क्षेत्र र कार्यस्थलमा लागू हुन्छ।\n\nII. श्रमिक प्रतिनिधित्व र आवाजको प्रत्याभूति\nश्रमसम्बन्धी सबै विषयमा व्यवस्थापनले श्रमिकको आवाज सुनोस् र विचार गरोस् भन्ने सुनिश्चित गर्न निम्न व्यवस्था लागू गरिन्छ:\n\n१. प्रतिनिधित्व र सम्पर्क\n• José Albino सन् २०२४ मा कार्यस्थलको सुरक्षा र स्वास्थ्यका लागि निर्वाचित प्रतिनिधि हुन्। GRASP प्रतिनिधिका रूपमा उनको निरन्तरता प्रत्येक वर्ष वा उत्पादन चक्रमा वर्तमान श्रमिकको स्वतन्त्र निर्णयमा निर्भर हुन्छ, जसको छुट्टै अभिलेख राखिन्छ।\n• श्रमिक प्रतिनिधि José Albino कामको अवस्था, सुरक्षा र कल्याणसम्बन्धी विषयमा श्रमिक र व्यवस्थापनबीच मुख्य सम्पर्क हुन्।\n• प्रतिनिधिको नाम, भूमिका र कामको समयमा सम्पर्क गर्ने तरिका श्रमिकलाई पहुँचयोग्य स्थान र श्रमिक पोर्टलमा जानकारी दिइन्छ। अनुमतिबिना व्यक्तिगत सम्पर्क विवरण सार्वजनिक गरिँदैन।\n\n२. प्रतिनिधिको भूमिकालाई सहयोग\n• व्यवस्थापन श्रमिकले रोजेका प्रतिनिधिलाई उनको स्वतन्त्रताको सम्मान गर्दै सहयोग गर्न प्रतिबद्ध छ।\n• प्रतिनिधिलाई श्रमिकसम्म पहुँच, आफ्नो काम गर्न उचित समय र स्थान उपलब्ध हुन्छ। लागू कानुनअनुसार ट्रेड युनियन प्रतिनिधि र कानुनी मान्यता प्राप्त अन्य प्रतिनिधिमूलक संस्थालाई पनि कार्यस्थलमा पहुँच दिइन्छ।\n\n३. जानकारी र अधिकार\n• सबै श्रमिकलाई श्रमिक समिति र ट्रेड युनियन स्थापना गर्ने, सदस्य बन्ने वा नबन्ने तथा प्रतिनिधित्वको अधिकार प्रयोग गर्ने अधिकारबारे जानकारी दिइन्छ (श्रम संहिता, धारा 440)। सम्बन्धित ट्रेड युनियनका सम्पर्क प्रतिनिधि र श्रमिकलाई उपलब्ध गराइन्छ।\n• भर्ती गर्दा र आवश्यक पर्दा श्रमिकले बुझ्ने भाषा, जस्तै पोर्चुगाली, अंग्रेजी, स्पेनी, नेपाली र हिन्दीमा जानकारी दिइन्छ; आवश्यक पर्दा मौखिक सहयोग गरिन्छ।\n\n४. प्रतिशोध र भेदभाव निषेध\n• Finca Tropic I, S.A. ले ट्रेड युनियनको सदस्य भए वा नभएको, प्रतिनिधिमूलक गतिविधि, उम्मेदवारी वा प्रतिनिधिको काम गरेको आधारमा भेदभाव, धम्की वा प्रतिशोध निषेध गर्छ।\n• प्रतिनिधित्व वा संघ गठनको अधिकार प्रयोग गरेबापत कुनै श्रमिकलाई हानि पुर्‍याइने छैन वा उसको तलब, कार्यसमय वा पदमा असर पारिने छैन।\n• कुनै उल्लङ्घन भएमा श्रमिक पोर्टल — A Tua Voz (https://perseagrowers.github.io/a-tua-voz/) मार्फत, श्रमिक प्रतिनिधिलाई वा सिधै ACT वा ट्रेड युनियनलाई गोप्य रूपमा, नाम नखुलाई समेत, कम्पनीको पूर्वअनुमति र प्रतिशोधबिना जानकारी दिन सकिन्छ।\n\nIII. स्वीकृति र सञ्चार\nFinca Tropic I, S.A. उपठेक्काका श्रमिकसहित सबै श्रमिकलाई यो नीति जानकारी दिने र लागू गर्ने प्रतिबद्धता जनाउँछ। प्रत्यक्ष जानकारी र कानुनी रूपमा सूचना टाँस्नुपर्ने दायित्व यथावत् राख्दै स्वीकृत संस्करण श्रमिक पोर्टलमा उपलब्ध गराइनेछ।"],["गुनासो र उजुरी व्यवस्थापन प्रक्रिया — संशोधन २","I. सिद्धान्त र प्रत्याभूतिको घोषणा\nFinca Tropic I, S.A. स्थायी, अस्थायी र उपठेक्काका सबै श्रमिकलाई प्रतिशोध, दण्ड वा सरकारी निकाय तथा अदालतमा जाने अधिकारमा बाधाबिना गोप्य गुनासो र सुझाव प्रक्रियामा पहुँच सुनिश्चित गर्छ।\n• पहुँच र सरलता: पोर्चुगाली, अंग्रेजी, स्पेनी, नेपाली र हिन्दीमा जानकारी दिइन्छ। आवश्यक पर्दा श्रमिकले बुझ्ने भाषामा मौखिक वा दृश्य निर्देशन दिइन्छ।\n• मौखिक गुनासो: तुरुन्तै समाधान भएका गुनासोसहित मौखिक प्त भएको र त्यसको नतिजा जानकारी दिन्छिन्, तर श्रमिकको पहिचान वा पहिचान हुन सक्ने विवरण दिँदिनन्।\n५. सहयोग: प्रतिनिधिले काम गर्न नसकेमा श्रमिक व्यवस्थापनमार्फत नगई ACT सहित स्वतन्त्र सहयोग लिन सक्छ। कम्पनीले आवश्यक सम्पर्क जानकारी उपलब्ध गराउँछ।\n\nIV. समाधान र समयसीमा\nरोजगारदाता प्रतिनिधिले विश्लेषणको समन्वय, विषय सम्बन्धित पक्षमा पठाउने र समयसीमाको अनुगमन गर्छिन्। व्यवस्थापन र मानव संसाधन विभागले आवश्यक साधन र निर्णय सुनिश्चित गर्छन्। सुरक्षाका जरुरी विषय वा प्रतिशोधको जोखिममा तत्काल हस्तक्षेप आवश्यक छ; आपतकालमा 112 मा फोन गर्नुहोस्।\n\nसमाधानको समयसीमा\n• प्रत्यक्ष श्रमिक: ३० दिनभित्र वा रोजगारको अन्तिम दिन पहिले भए सोभन्दा अघि विश्लेषण पूरा गरी निर्णय जानकारी दिने प्रयास गर्ने।\n• उपठेक्काका श्रमिक: समान ३० दिनको सीमा वा सेवा सम्झौताको अन्तिम दिन पहिले भए सो दिनको सीमा लागू गर्ने। आवश्यक पर्दा अभिलेख तालिकाको स्वचालित समयसीमा हातैले मिलाउने।\n\nसमाधानको प्रक्रिया\n१. जवाफ: कारणसहितको निर्णय, अपनाइएका उपाय वा समाधान गर्न नसक्नुको कारण जानकारी दिने। श्रमिकले बुझ्ने भाषा प्रयोग गर्ने।\n२. नाम नखुलाई दिइएका गुनासो: वेब एपमा जवाफ हेर्न श्रमिकले निजी कोड राख्छ। श्रमिकका सूचना स्थानमा नाम वा पहिचान खुल्ने विवरणबिना जवाफको सामान्य सूचना पनि प्रकाशित गर्ने। संवेदनशील जानकारी प्रकाशित नगर्ने।\n३. ढिलाइ: कारण, अनुमानित समाप्ति मिति र श्रमिकलाई दिएको जानकारी अभिलेख गर्ने। श्रमिकले स्वेच्छाले पहिचान दिएमा दिएको सम्पर्क प्रयोग गर्ने; नाम नखुलाइएको भए उचित माध्यमबाट अद्यावधिक जानकारी दिने।\n\nउपठेक्काका श्रमिकको गुनासो\n• व्यावसायिक सम्झौताभित्र: Finca Tropic ले कार्यस्थलको अवस्था अनुसन्धान गर्छ, ETT सँग समन्वय गर्छ र समाधान अनुगमन गर्छ।\n• व्यावसायिक सम्झौताबाहिर: ACT सहित कानुनी र सरकारी सहयोगबारे जानकारी दिने र उचित भएमा प्रत्यक्ष रोजगारदातासमक्ष पठाउने; वैध आधारबिना पहिचान नखुलाउने। Finca Tropic का आफ्नै दायित्व अनुगमन गर्ने।\n\nV. अभिलेख र भण्डारण\nरोजगारदाता प्रतिनिधिले सञ्चार, सुधारात्मक कारबाही र अनुगमनको निजी अभिलेख राख्छिन्। डिजिटल गुनासो स्वतः अभिलेख हुन्छन्; अन्य हातैले अभिलेख गरिन्छन्। परीक्षणलाई छुट्टै पहिचान गरी राखिन्छ।\n• संरक्षण अवधि: गुनासोको सारांश कम्तीमा २४ महिना राख्ने। थप व्यक्तिगत तथ्याङ्क राख्नुपर्ने आवश्यकता समीक्षा गर्ने र आवश्यक नरहेका तथ्याङ्क हटाउने, कानुनी दायित्व वा विचाराधीन प्रक्रियामा असर नपर्ने गरी।\n\nअभिलेखको न्यूनतम सामग्री\nप्राप्ति, प्रक्रिया र निर्णय अनुगमन गर्न अभिलेखमा निम्न समावेश हुनुपर्छ:\n• अभिलेख नम्बर र प्राप्ति मिति।\n• गुनासोको विवरण (मौखिक वा तुरुन्त समाधान भएमा विषय)।\n• स्वेच्छिक र आवश्यक भए मात्र पहिचान; नाम गोप्य भएको सङ्केत।\n• सुधारात्मक कारबाही/अन्तिम समाधान र निर्णय।\n• समाधानको अवधि।\n• निर्णय जानकारी दिएको प्रमाण (वेब एपमा उपलब्ध मिति, सामान्य सूचना वा अन्य माध्यम); जवाफ पढिसकेको अनुमान नगर्ने।\n\nVI. गोपनीयता, अनुगमन र स्वीकृति\nडिजिटल सूचना रोजगारदाता प्रतिनिधि (Marta Martins), प्राविधिक Gonçalo Ramires र Alexandre Loução तथा मानव संसाधन निर्देशक (D. González) लाई पठाइन्छ। चारै जनाले गुनासोको सामग्री पाउँछन्; अधिकृत व्यक्तिले मात्र निजी अभिलेख हेर्न सक्छन्। जथाभावी अरूलाई नपठाउने र प्रतिशोधका लागि प्रयोग नगर्ने। गुनासो कुनै सूचना प्राप्तकर्तासँग सम्बन्धित भएमा त्यो व्यक्ति अनुसन्धान वा निर्णयमा सहभागी हुनु हुँदैन; श्रमिकले सिधै स्वतन्त्र माध्यम प्रयोग गर्न सक्छ।\nगोपनीयता: वेब एपले लगइन माग्दैन र जानाजानी IP ठेगाना वा स्थान सङ्कलन गर्दैन। होस्टिङ सेवाले प्राविधिक लग राख्न सक्छ। नाम गोप्य राख्न चाहने श्रमिकले पहिचान खुल्ने विवरण दिनु हुँदैन। निजी कोड ह्यासका रूपमा भण्डारण हुन्छ र सूचनामा पठाइँदैन। गुनासो व्यवस्थापन र लागू दायित्व पूरा गर्न तथ्याङ्क प्रशोधन गरिन्छ; तथ्याङ्क संरक्षण अधिकारसम्बन्धी अनुरोध mmartins@perseagrowers.com मार्फत कम्पनीलाई पठाउन सकिन्छ।\nअनुगमन: गुनासो नआएको अवस्थामा समेत प्रणालीको कार्यसम्पादन जाँचको अभिलेख राख्ने। फाराम उपलब्ध नभए श्रमिक प्रतिनिधि वा ACT मा पठाउने। वास्तविक प्रयोगको प्रमाणका रूपमा काल्पनिक गुनासो नबनाउने।\nलागू हुने अवस्था: व्यवस्थापनको स्वीकृति, गोपनीयता जानकारीको प्रमाणीकरण र श्रमिक तथा ETT लाई जानकारी दिएपछि उत्पादन मोड सक्रिय गर्ने। २०२५ को संस्करण अभिलेखमा रहन्छ।\nसन्दर्भ: GLOBALG.A.P. GRASP v2.0_Sep22, खण्ड 3, मापदण्ड 3.1 देखि 3.7 (पृष्ठ 12–19)।"],["असल आचरण संहिता — उत्पीडन रोकथाम — संशोधन १","१. उद्देश्य र लागू क्षेत्र\nFinca Tropic I, S.A. र Extraissol, Lda. ले उत्पीडन, हिंसा र भेदभावप्रति शून्य सहनशीलताको नीति अपनाउँछन्। यो संहिता खेतबारी र व्यावसायिक सम्बन्धमा, डिजिटल सञ्चारसहित, प्रत्यक्ष, अस्थायी श्रमिक, सुपरभाइजर, व्यवस्थापन, सेवा प्रदायक र आगन्तुकमा लागू हुन्छ।\n\n२. उत्पीडन भनेको के हो?\nकुनै व्यक्तिलाई विचलित गर्ने वा दबाब दिने, उसको मर्यादामा असर गर्ने वा डर, शत्रुता, अपमान, हीनता वा अस्थिरताको वातावरण सिर्जना गर्ने उद्देश्य वा प्रभाव भएको अनिच्छित व्यवहार हो। यौन उत्पीडनमा अनिच्छित यौन प्रकृतिका मौखिक, गैरमौखिक वा शारीरिक व्यवहार पर्छन्। मूल्याङ्कन तथ्य र सन्दर्भमा निर्भर हुन्छ।\n\n३. निषेधित व्यवहार\nगाली, धम्की, अपमान, त्रास, अनुचित एक्ल्याउने व्यवहार, भेदभावपूर्ण टिप्पणी, अनिच्छित शारीरिक सम्पर्क, अनिच्छित यौन प्रस्ताव वा यौन सुविधा प्राप्त गर्न दबाब। सबै प्रकारका प्रतिशोध पनि निषेध छन्। सम्मान र उचित अनुपातमा गरिएको वैध कार्य व्यवस्थापन आफैँमा उत्पीडन होइन।\n\n४. रोकथाम र जिम्मेवारी\nसुपरभाइजरले सम्मानजनक सम्बन्ध प्रवर्द्धन गर्न, अनुचित व्यवहारमा हस्तक्षेप गर्न र जोखिमपूर्ण अवस्था रिपोर्ट गर्नुपर्छ। सबैले सहकर्मीको सम्मान गर्न, तथ्य स्पष्ट गर्न सहयोग गर्न र गोपनीयता कायम गर्नुपर्छ। कम्पनीले ETT लाई समेत बुझिने भाषामा जानकारी र सञ्चार सुनिश्चित गर्छ।\n\n५. कसरी जानकारी दिने?\nप्रभावित व्यक्ति वा साक्षीले A Tua Voz पोर्टल https://perseagrowers.github.io/a-tua-voz/ मा मौखिक वा लिखित रूपमा, नाम नखुलाई समेत जानकारी दिन सक्छ। श्रमिक प्रतिनिधि, मानव संसाधन विभाग वा सिधै ACT (300 069 300) र CITE (800 204 684) लाई पूर्वअनुमतिबिना सम्पर्क गर्न सकिन्छ। सूचना प्राप्तकर्ता घटनामा संलग्न भए स्वतन्त्र माध्यम प्रयोग गर्नुपर्छ। तत्काल खतरा भए 112 मा फोन गर्नुहोस्।\n\n६. प्रक्रिया, संरक्षण र परिणाम\nप्रत्येक रोजगारदाताले कार्यस्थलमा उत्पीडनको आरोपबारे थाहा पाएपछि कानुनअनुसार अनुशासनात्मक प्रक्रिया सुरु गर्छ। छानबिन छिटो, निष्पक्ष र गोप्य हुनुपर्छ; स्वार्थ बाझिएका व्यक्तिलाई अलग गर्ने, सम्बन्धित व्यक्तिको उचित संरक्षण गर्ने र जवाफ दिने अधिकार सम्मान गर्ने। ETT का घटनामा सम्बन्धित रोजगारदातासँग समन्वय गरिन्छ। प्रमाणित तथ्यले अन्य जिम्मेवारीमा असर नपर्ने गरी कानुनी र समानुपातिक दण्ड निम्त्याउन सक्छ। सद्भावपूर्वक जानकारी दिएबापत प्रतिशोध हुँदैन; उजुरीकर्ता र साक्षीलाई श्रम संहिताको धारा 29(6) को संरक्षण प्राप्त हुन्छ। अभिलेखमा पहुँच आवश्यक व्यक्तिमा सीमित हुन्छ।\n\n७. जानकारी र समीक्षा\nदुवै कम्पनीको स्वीकृतिपछि संहिता श्रमिक पोर्टलमा प्रकाशित गरिनेछ, भर्तीका बेला बुझाइनेछ र कानुनी परिवर्तन वा पहिचान भएका आवश्यकताअनुसार समीक्षा गरिनेछ।\nसन्दर्भ: श्रम संहिता धारा 29, 127(1)(k) र (l), तथा 283; कानुन 73/2017; मानव अधिकार नीति र गुनासो प्रक्रिया।"],["अनुशासनात्मक प्रक्रिया — संशोधन १","१. उद्देश्य र लागू क्षेत्र\nFinca Tropic I, S.A. र Extraissol, Lda. मा सम्भावित अनुशासन उल्लङ्घन निष्पक्ष, समानुपातिक र गोप्य तरिकाले सम्बोधन गर्ने। प्रक्रिया प्रत्यक्ष श्रमिकमा लागू हुन्छ। अस्थायी वा उपठेक्काका श्रमिकका हकमा तथ्य सम्बन्धित रोजगारदातालाई जानकारी दिइन्छ, जसलाई अनुशासनात्मक कारबाही गर्ने अधिकार हुन्छ।\n\n२. व्यवहार र रोकथाम\nसुरक्षा नियम, सहकर्मीको सम्मान, उपस्थितिको नियम र वैध निर्देशनलगायत श्रम दायित्वको दोषपूर्ण उल्लङ्घन अनुशासनात्मक मूल्याङ्कनको विषय हुन सक्छ। उपयुक्त भएमा स्पष्टीकरण र मार्गदर्शनलाई प्राथमिकता दिइन्छ, उत्पीडनको आरोपमा प्रक्रिया सुरु गर्नुपर्ने कानुनी दायित्व यथावत् राख्दै।\n\n३. प्रक्रिया र प्रतिरक्षाको अधिकार\nसुपरभाइजरले रोजगारदाता संस्थाको मानव संसाधन विभाग वा व्यवस्थापनलाई तथ्य जानकारी दिन्छ। स्वार्थको द्वन्द्वबाट बच्दै तथ्य अभिलेख गरिन्छ, प्रमाण सङ्कलन गरिन्छ र सम्बन्धित व्यक्तिका कुरा सुनिन्छ। श्रमिकलाई आरोपबारे जानकारी दिइन्छ र कुनै दण्डअघि प्रतिरक्षाको वास्तविक अवसर दिइन्छ। कानुनी समयसीमा, गोपनीयता र उचित कारणले बर्खास्तगी हुन सक्ने अवस्थासहित विशेष प्रक्रिया सम्मान गरिन्छ।\n\n४. निर्णय र अनुशासनात्मक उपाय\nनिर्णय रोजगारदाता वा प्रत्यायोजित अधिकार भएको व्यक्तिले गर्छ। कुनै दण्ड कानुनी, कारणसहित र उल्लङ्घनको गम्भीरता तथा दोषअनुसार समानुपातिक हुनुपर्छ। एउटै उल्लङ्घनमा एकभन्दा बढी दण्ड दिन पाइँदैन। चेतावनी वा अभिलेखित चेतावनी र गम्भीर अवस्थामा GRASP सँग मिल्ने अन्य कानुनसम्मत उपाय लागू गर्न सकिन्छ। अनुशासनात्मक उपायका रूपमा तलब कटौती निषेध छ। अनुशासनात्मक जरिवाना वा तलब गुम्ने निलम्बन लागू गरिँदैन।\n\n५. प्रत्याभूति र गुनासो\nअधिकार प
