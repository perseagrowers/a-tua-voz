const rightsData2026={"PT":[["Salários e alimentação","Em 2026, o mínimo nacional é 920 €. No CCT AHSA–SETAAB, o nível 11 é 925 € brutos/mês a tempo completo. O subsídio de alimentação é 6 € por dia quando trabalhas mais de metade do período normal diário. Tens direito a recibo discriminado."],["Horário e descanso","8 horas/dia e 40/semana em regime normal. Pausa de 30 minutos a 2 horas; descanso diário geralmente de 11 horas. Descanso semanal obrigatório. As horas efetivas devem ser registadas."],["Horas extraordinárias","Até 100 h/ano: +25% primeira hora, +37,5% seguintes; descanso semanal ou feriado +50% por hora. Acima de 100 h: +50%, +75% e +100%, respetivamente. Limite geral do CCT: 200 h/ano e 2 h por dia normal, salvo exceções legais."],["Trabalho noturno e regimes especiais","Das 20h às 7h: +25%. Isenção exige acordo escrito: 25% da retribuição mínima na modalidade sem limites normais; 5–10% nas restantes, sem prejuízo das garantias legais. Adaptabilidade e banco de horas exigem condições legais e compensação."],["Férias e subsídios","22 dias úteis de férias por ano; possível majoração por assiduidade. No ano de admissão, 2 dias úteis/mês até 20, em regra após 6 meses. Direito a subsídios de férias e Natal."],["Doença, parentalidade e formação","Direito a faltas justificadas, licenças parentais e proteção social nas condições legais. Formação contínua: 40 horas anuais, proporcional nos contratos a termo de pelo menos 3 meses."],["Igualdade, segurança e ETT","Direito a tratamento igual, condições seguras, EPI gratuitos, informação sobre o contrato e representação sindical. Trabalhadores temporários têm direito à remuneração mais favorável nos termos do art. 185.º do Código do Trabalho. Podes reclamar sem represálias."]],"EN":[["Pay and meals","In 2026 the national minimum is €920. Under AHSA–SETAAB, level 11 is €925 gross/month for full-time work. Meal allowance: €6 per day when working more than half your normal daily hours. You are entitled to an itemised payslip."],["Working hours and rest","Normally 8 hours/day and 40/week. Breaks of 30 minutes to 2 hours; generally 11 hours of daily rest. Mandatory weekly rest. Actual hours must be recorded."],["Overtime","Up to 100 hours/year: +25% first hour, +37.5% subsequent hours; weekly rest days or holidays +50% per hour. Above 100 hours: +50%, +75% and +100% respectively. General collective agreement limits: 200 hours/year and 2 hours per normal working day, subject to legal exceptions."],["Night work and special schedules","20:00–07:00: +25%. Exemption from fixed working hours requires written agreement: 25% of minimum pay for the unrestricted normal-hours arrangement; 5–10% for other arrangements, subject to statutory guarantees. Flexible averaging and time banks require legal conditions and compensation."],["Holidays and allowances","22 working days of paid annual leave, potentially increased for attendance. In the hiring year: 2 working days/month up to 20, generally after 6 months. Holiday and Christmas allowances."],["Illness, parental rights and training","Justified absences, parental leave and social protection subject to legal conditions. Continuing training: 40 hours/year, proportional for fixed-term contracts of at least 3 months."],["Equality, safety and agency workers","Equal treatment, safe working conditions, free PPE, employment information and union representation. Temporary agency workers are entitled to the more favourable pay under Labour Code article 185. You may complain without retaliation."]],"ES":[["Salarios y alimentación","En 2026 el mínimo nacional es 920 €. En el convenio AHSA–SETAAB, el nivel 11 es 925 € brutos/mes a jornada completa. Ayuda de comida: 6 € por día si trabajas más de la mitad de la jornada normal. Derecho a nómina detallada."],["Horario y descanso","Normalmente 8 horas/día y 40/semana. Pausa de 30 minutos a 2 horas; descanso diario generalmente de 11 horas. Descanso semanal obligatorio. Deben registrarse las horas reales."],["Horas extraordinarias","Hasta 100 h/año: +25% primera hora, +37,5% siguientes; descanso semanal o festivo +50% por hora. Por encima de 100 h: +50%, +75% y +100%, respectivamente. Límite general del convenio: 200 h/año y 2 h por día normal, salvo excepciones legales."],["Trabajo nocturno y regímenes especiales","De 20:00 a 07:00: +25%. La exención de horario exige acuerdo escrito: 25% de la remuneración mínima en modalidad sin límites normales; 5–10% en las demás, respetando garantías legales. Adaptabilidad y banco de horas requieren condiciones legales y compensación."],["Vacaciones y pagas","22 días laborables de vacaciones pagadas al año, ampliables por asistencia. Año de contratación: 2 días laborables/mes hasta 20, normalmente tras 6 meses. Pagas de vacaciones y Navidad."],["Enfermedad, parentalidad y formación","Ausencias justificadas, permisos parentales y protección social según la ley. Formación continua: 40 horas anuales, proporcional en contratos temporales de al menos 3 meses."],["Igualdad, seguridad y ETT","Igualdad, condiciones seguras, EPI gratuitos, información contractual y representación sindical. Trabajadores de ETT: remuneración más favorable según el artículo 185 del Código del Trabajo. Puedes reclamar sin represalias."]],"NE":[["तलब र खाना भत्ता","२०२६ मा राष्ट्रिय न्यूनतम तलब €920 हो। AHSA–SETAAB सम्झौताको तह ११ मा पूर्णकालीन कामको मासिक कुल न्यूनतम तलब €925 हो। दैनिक सामान्य कामको आधाभन्दा बढी काम गरेमा €6 खाना भत्ता पाइन्छ। तलबको विस्तृत विवरण पाउने अधिकार छ।"],["कामको समय र विश्राम","सामान्यतया दिनमा ८ र हप्तामा ४० घण्टा। विश्राम ३० मिनेटदेखि २ घण्टासम्म; दैनिक विश्राम सामान्यतया ११ घण्टा। साप्ताहिक अनिवार्य विश्राम। वास्तविक कामको समय दर्ता गर्नुपर्छ।"],["अतिरिक्त काम","वार्षिक १०० घण्टासम्म पहिलो घण्टा +25%, त्यसपछि +37.5%; साप्ताहिक विश्राम वा सार्वजनिक बिदामा प्रति घण्टा +50%। १०० घण्टाभन्दा माथि क्रमशः +50%, +75% र +100%। सामान्य सीमा वर्षमा २०० घण्टा र सामान्य कार्यदिवसमा २ घण्टा, कानुनी अपवाद बाहेक।"],["रात्रि काम र विशेष समय व्यवस्था","राति ८ बजेदेखि बिहान ७ बजेसम्म +25%। निश्चित समयको सीमाबाट छुटका लागि लिखित सम्झौता आवश्यक छ: सामान्य समय सीमामा नबाँधिने व्यवस्थामा न्यूनतम तलबको 25%, अन्यमा 5–10%, कानुनी संरक्षण लागू हुन्छ। लचिलो समय र समय बैंकका लागि कानुनी सर्त र क्षतिपूर्ति आवश्यक छन्।"],["बिदा र भत्ता","वर्षमा २२ कार्यदिवस सशुल्क बिदा; उपस्थितिका आधारमा थप दिन सम्भव। नियुक्ति वर्षमा प्रति महिना २ कार्यदिवस, बढीमा २०, सामान्यतया ६ महिनापछि। बिदा र क्रिसमस भत्ता।"],["बिरामी, अभिभावकत्व र तालिम","कानुनी सर्तअनुसार उचित अनुपस्थिति, अभिभावक बिदा र सामाजिक सुरक्षा। वार्षिक ४० घण्टा तालिम; कम्तीमा ३ महिनाको निश्चित अवधिको सम्झौतामा समानुपातिक।"],["समानता, सुरक्षा र अस्थायी कामदार","समान व्यवहार, सुरक्षित काम, निःशुल्क सुरक्षा उपकरण, सम्झौताको जानकारी र श्रमिक संघको प्रतिनिधित्वको अधिकार। अस्थायी एजेन्सीका कामदारलाई श्रम संहिताको धारा १८५ अनुसार बढी अनुकूल तलब पाउने अधिकार छ। प्रतिशोध बिना गुनासो गर्न सकिन्छ।"]],"HI":[["वेतन और भोजन भत्ता","2026 में राष्ट्रीय न्यूनतम वेतन €920 है। AHSA–SETAAB समझौते के स्तर 11 में पूर्णकालिक काम का न्यूनतम सकल मासिक वेतन €925 है। सामान्य दैनिक समय के आधे से अधिक काम करने पर €6 भोजन भत्ता। विस्तृत वेतन पर्ची पाने का अधिकार है।"],["कार्य समय और आराम","सामान्यतः 8 घंटे प्रतिदिन और 40 घंटे प्रति सप्ताह। 30 मिनट से 2 घंटे का विराम; सामान्यतः 11 घंटे दैनिक आराम। अनिवार्य साप्ताहिक आराम। वास्तविक काम के घंटे दर्ज होने चाहिए।"],["अतिरिक्त काम","वर्ष में 100 घंटे तक पहली अतिरिक्त घंटे पर +25%, बाद के घंटों पर +37.5%; साप्ताहिक आराम या छुट्टी के दिन प्रति घंटे +50%। 100 घंटे से अधिक होने पर क्रमशः +50%, +75% और +100%। सामान्य सीमा 200 घंटे/वर्ष और सामान्य कार्यदिवस में 2 घंटे, कानूनी अपवादों के अधीन।"],["रात्रि काम और विशेष समय व्यवस्था","रात 8 से सुबह 7 बजे तक +25%। निर्धारित समय से छूट के लिए लिखित समझौता आवश्यक है: सामान्य समय सीमा से मुक्त व्यवस्था में न्यूनतम वेतन का 25%, अन्य व्यवस्थाओं में 5–10%, कानूनी सुरक्षा के अधीन। लचीली समय व्यवस्था और समय बैंक के लिए कानूनी शर्तें और मुआवजा आवश्यक हैं।"],["छुट्टियाँ और भत्ते","प्रति वर्ष 22 कार्यदिवस सवेतन छुट्टी; उपस्थिति के आधार पर अतिरिक्त दिन संभव। नियुक्ति वर्ष में 2 कार्यदिवस प्रति माह, अधिकतम 20, सामान्यतः 6 महीने बाद। छुट्टी और क्रिसमस भत्ते।"],["बीमारी, मातृत्व-पितृत्व और प्रशिक्षण","कानून के अनुसार उचित अनुपस्थिति, माता-पिता की छुट्टी और सामाजिक सुरक्षा। सालाना 40 घंटे प्रशिक्षण; कम से कम 3 महीने के निश्चित अवधि अनुबंधों में आनुपातिक।"],["समानता, सुरक्षा और अस्थायी श्रमिक","समान व्यवहार, सुरक्षित काम, मुफ्त सुरक्षा उपकरण, अनुबंध की जानकारी और यूनियन प्रतिनिधित्व का अधिकार। अस्थायी एजेंसी श्रमिकों को श्रम संहिता के अनुच्छेद 185 के अनुसार अधिक अनुकूल वेतन का अधिकार है। बिना प्रतिशोध शिकायत कर सकते हैं।"]]},rightsCats2026={"PT":["Diretor geral","Diretor de serviços","Gestor de área; técnico oficial de contas","Técnico superior ou especialista de área","Assistente de produção; coordenador de área","Técnico de área","Encarregado de armazém; secretário de direção","Assistente administrativo; supervisor de área; auxiliar de manutenção técnica","Chefe de equipa","Operador de máquinas agrícolas; aplicador de fitofármacos e adubos; apontador; assistente de supervisão; motorista","Empregado de armazém; guarda; operador de limpeza industrial, linha de produção ou rega; trabalhador agrícola; ajudante de armazém; trabalhador auxiliar"],"EN":["General director","Services director","Area manager; certified accountant","Senior or specialist area technician","Production assistant; area coordinator","Area technician","Warehouse supervisor; executive secretary","Administrative assistant; area supervisor; maintenance technician assistant","Team leader","Agricultural machinery operator; pesticide and fertiliser applicator; timekeeper; supervision assistant; driver","Warehouse worker; property guard; industrial cleaner; production line or irrigation operator; farm worker; warehouse assistant; auxiliary worker"],"ES":["Director general","Director de servicios","Gestor de área; contable certificado","Técnico superior o especialista de área","Asistente de producción; coordinador de área","Técnico de área" छ। आधिकारिक स्रोत हेर्नुहोस्।"],"HI":["2026 वेतन तालिका","स्तर","श्रेणी","मासिक सकल (€)","सूचना सारांश — 24/11/2026। अनुवाद समीक्षा के अधीन हैं। आधिकारिक स्रोत देखें।"]},rightsAmounts2026=[1480,1250,1200,1100,1060,1050,1030,985,960,950,925];
function renderRights2026(){const l=document.getElementById('lang').value;const a=rightsData2026[l]||rightsData2026.PT;const t=rightsTitles2026[l]||rightsTitles2026.PT;const c=rightsCats2026[l]||rightsCats2026.PT;const root=document.getElementById('rightsContent2026');root.replaceChildren();const note=document.createElement('p');note.textContent=t[4];root.append(note);a.forEach(([title,body],i)=>{const d=document.createElement('details');d.className='rightsDetail';const h=document.createElement('summary');h.textContent=title;d.append(h);const p=document.createElement('p');p.textContent=body;d.append(p);root.append(d);if(i===0){const box=document.createElement('details');box.className='rightsDetail';const h=document.createElement('summary');h.textContent=t[0];box.append(h);const table=document.createElement('table');table.className='rightsTable';const head=table.createTHead().insertRow();t.slice(1,4).forEach(x=>{const th=document.createElement('th');th.scope='col';th.textContent=x;head.append(th)});const body=table.createTBody();c.forEach((x,j)=>{const row=body.insertRow();[j+1,x,rightsAmounts2026[j]].forEach(v=>row.insertCell().textContent=v)});box.append(table);root.append(box)}});const sources=[['BTE 11/2025 – CCT AHSA–SETAAB','https://bte.dgcp.mtsss.gov.pt/completos/2025/bte11_2025.pdf'],['BTE 15/2025 – Retificação','https://bte.dgcp.mtsss.gov.pt/completos/2025/bte15_2025.pdf'],['Portaria 388/2025/1','https://diariodarepublica.pt/dr/detalhe/portaria/388-2025-945692108'],['Código do Trabalho','https://diariodarepublica.pt/dr/legislacao-consolidada/lei/2009-34546475'],['gov.pt – Trabalhar em Portugal','https://www.gov.pt/guias/trabalhar-em-portugal']];sources.forEach(([n,u])=>{const p=document.createElement('p');const link=document.createElement('a');link.textContent=n;link.href=u;link.target='_blank';link.rel='noopener noreferrer';p.append(link);root.append(p)});}

</script><script>
const portalLibrary2026={"PT":{"back":"Voltar ao menu","p":[["Direitos humanos — revisão 2","Respeito pela dignidade de todos, incluindo trabalhadores temporários e migrantes. Proibição de trabalho forçado, retenção de documentos, trabalho infantil, discriminação, assédio e corrupção. Direito a remuneração legal, descanso, férias, segurança, representação e reclamação sem represálias."],["Liberdade de associação — revisão 2","Podes criar, aderir ou não aderir a sindicatos, escolher representantes e participar na negociação coletiva sem pressão ou discriminação. Os representantes têm direito a condições adequadas para exercer as suas funções."],["Reclamações — revisão 2","Usa A Tua Voz, com identificação facultativa, ou fala com o representante ou empregador. Podes recorrer diretamente à ACT. Guarda o código privado para consultar a resposta. O objetivo é responder em até 30 dias ou antes do fim do emprego ou prestação, se anterior. Não partilhes o código. Evita dados identificativos se pretendes anonimato."],["Prevenção do assédio — revisão 1","São proibidos insultos, humilhações, ameaças, intimidação, discriminação e comportamentos sexuais indesejados. Vítimas e testemunhas podem comunicar situações verbalmente ou por escrito, incluindo anonimamente. A investigação deve ser imparcial, confidencial e sem represálias. Se existir conflito de interesses, contacta uma entidade independente."],["Procedimento disciplinar — revisão 1","O trabalhador tem direito a conhecer os factos e defender-se antes de qualquer sanção. As decisões devem ser legais, fundamentadas e proporcionais. Não são previstas multas disciplinares nem suspensão com perda de remuneração. Podes contestar e procurar apoio independente."]],"rep":["José Albino — representante dos trabalhadores","Podes falar pessoalmente com José Albino durante o trabalho para apresentar preocupações, necessidades ou sugestões. A representação é independente; podes procurar diretamente um sindicato ou a ACT. A participação dos trabalhadores das ETT na representação deve ser assegurada."],"s":[["Segurança geral","Cumpre as instruções de segurança, comunica perigos, incidentes e acidentes ao supervisor e pede esclarecimentos se tiveres dúvidas."],["Equipamentos de proteção","Usa calçado fechado e EPI adequado à tarefa. Mantém os equipamentos limpos e em bom estado. Comunica necessidades de substituição. Usa roupa adequada ao sol, calor ou chuva."],["Máquinas e cargas","Mantém distância das máquinas em manobra, especialmente da parte traseira. Evita obstáculos e desníveis; mantém a carga perto do corpo e utiliza a força das pernas ao levantar."],["Emergências","Comunica imediatamente acidentes ao supervisor. Em emergência liga 112. Respeita a sinalização e as instruções locais."]],"law":"Fontes oficiais e informação complementar"},"EN":{"back":"Back to menu","p":[["Human rights — revision 2","Respect for everyone’s dignity, including temporary and migrant workers. Forced labour, retention of documents, child labour, discrimination, harassment and corruption are prohibited. Rights to lawful pay, rest, leave, safety, representation and complaints without retaliation."],["Freedom of association — revision 2","You may form, join or decline to join unions, choose representatives and participate in collective bargaining without pressure or discrimination. Representatives are entitled to appropriate conditions to carry out their duties."],["Complaints — revision 2","Use A Tua Voz, with optional identification, or speak to the representative or employer. You may contact ACT directly. Keep your private code to check the response. The target is a response within 30 days or before employment or service ends, if earlier. Do not share the code. Avoid identifying details if you wish to remain anonymous."],["Harassment prevention — revision 1","Insults, humiliation, threats, intimidation, discrimination and unwanted sexual behaviour are prohibited. Victims and witnesses may report verbally or in writing, including anonymously. Investigation must be impartial, confidential and free from retaliation. If there is a conflict of interest, contact an independent organisation."],["Disciplinary procedure — revision 1","Workers have the right to know the allegations and defend themselves before any sanction. Decisions must be lawful, reasoned and proportionate. Disciplinary fines and unpaid suspension are excluded. You may challenge decisions and seek independent support."]],"rep":["José Albino — workers’ representative","Speak to José Albino in person during work about concerns, needs or suggestions. Representation is independent; you can contact a union or ACT directly. Agency workers must be given an opportunity to participate in representation."],"s":[["General safety","Follow safety instructions, report hazards, incidents and accidents to your supervisor and ask for clarification if unsure."],["Protective equipment","Wear closed footwear and PPE suitable for the task. Keep equipment clean and in good condition. Report replacement needs. Wear suitable clothing for sun, heat or rain."],["Machinery and loads","Stay away from manoeuvring machinery, especially the rear. Avoid obstacles and uneven ground; hold loads close to your body and lift using your legs."],["Emergencies","Report accidents immediately to your supervisor. In emergencies call 112. Follow safety signs and local instructions."]],"law":"Official sources and further information"},"ES":{"back":"Volver al menú","p":[["Derechos humanos — revisión 2","Respeto a la dignidad de todos, incluidos temporales y migrantes. Se prohíben el trabajo forzoso, la retención de documentos, el trabajo infantil, la discriminación, el acoso y la corrupción. Derecho a salario legal, descanso, vacaciones, seguridad, representación y quejas sin represalias."],["Libertad sindical — revisión 2","Puedes crear sindicatos, afiliarte o no, elegir representantes y participar en la negociación colectiva sin presión ni discriminación. Los representantes tienen derecho a condiciones adecuadas para ejercer sus funciones."],["Quejas — revisión 2","Utiliza A Tua Voz, con identificación opcional, o habla con el representante o empleador. Puedes acudir directamente a ACT. Guarda el código privado para consultar la respuesta. Se procura responder en 30 días o antes del fin del empleo o servicio, si es anterior. No compartas el código. Evita datos identificativos si deseas anonimato."],["Prevención del acoso — revisión 1","Se prohíben insultos, humillaciones, amenazas, intimidación, discriminación y conductas sexuales no deseadas. Víctimas y testigos pueden comunicar verbalmente o por escrito, incluso de forma anónima. Investigación imparcial, confidencial y sin represalias. Ante un conflicto de intereses, acude a una entidad independiente."],["Procedimiento disciplinario — revisión 1","Derecho a conocer los hechos y defenderse antes de cualquier sanción. Las decisiones deben ser legales, motivadas y proporcionales. Se excluyen multas disciplinarias y suspensión sin sueldo. Puedes impugnar y buscar apoyo independiente."]],"rep":["José Albino — representante de los trabajadores","Puedes hablar personalmente con José Albino durante el trabajo sobre necesidades, preocupaciones o sugerencias. La representación es independiente; puedes acudir directamente a un sindicato o ACT. Debe garantizarse la participación de trabajadores de ETT."],"s":[["Seguridad general","Cumple las instrucciones, comunica peligros, incidentes y accidentes al supervisor y pide aclaraciones si tienes dudas."],["Equipos de protección","Usa calzado cerrado y EPI adecuado a la tarea. Mantén los equipos limpios y en buen estado. Comunica necesidades de sustitución. Usa ropa adecuada al sol, calor o lluvia."],["Máquinas y cargas","Aléjate de máquinas en maniobra, especialmente de su parte trasera. Evita obstáculos y desniveles; acerca la carga al cuerpo y levanta con las piernas."],["Emergencias","Comunica inmediatamente los accidentes al supervisor. En emergencia llama al 112. Respeta la señalización e instrucciones locales."]],"law":"Fuentes oficiales e información adicional"},"NE":{"back":"मेनुमा फर्कनुहोस्","p":[["मानव अधिकार — संशोधन २","अस्थायी र आप्रवासी श्रमिकसहित सबैको मर्यादाको सम्मान। जबरजस्ती श्रम, कागजात रोक्ने, बालश्रम, भेदभाव, उत्पीडन र भ्रष्टाचार निषेध। कानुनी तलब, विश्राम, बिदा, सुरक्षा, प्रतिनिधित्व र प्रतिशोध बिना गुनासो गर्ने अधिकार।"],["संघको स्वतन्त्रता — संशोधन २","दबाब वा भेदभाव बिना श्रमिक संघ बनाउन, सदस्य बन्न वा नबन्न, प्रतिनिधि छान्न र सामूहिक वार्तामा भाग लिन सक्नुहुन्छ। प्रतिनिधिलाई काम गर्न उपयुक्त अवस्था उपलब्ध हुनुपर्छ।"],["गुनासो — संशोधन २","A Tua Voz प्रयोग गर्नुहोस्, पहिचान वैकल्पिक छ, वा प्रतिनिधि वा रोजगारदातासँग कुरा गर्नुहोस्। ACT लाई सिधै सम्पर्क गर्न सक्नुहुन्छ। जवाफ हेर्न गोप्य कोड सुरक्षित राख्नुहोस्। ३० दिनभित्र वा रोजगारी/सेवा पहिले समाप्त भए त्यसअघि जवाफ दिने लक्ष्य छ। कोड अरूलाई नदिनुहोस्। गोप्य रहन पहिचान खुल्ने विवरण नदिनुहोस्।"],["उत्पीडन रोकथाम — संशोधन १","अपमान, धम्की, डर देखाउने, भेदभाव र अनिच्छित यौन व्यवहार निषेध। पीडित र साक्षीले मौखिक वा लिखित रूपमा, नाम नदिई पनि जानकारी दिन सक्छन्। निष्पक्ष र गोप्य अनुसन्धान, प्रतिशोध निषेध। स्वार्थको द्वन्द्व भए स्वतन्त्र संस्थामा सम्पर्क गर्नुहोस्।"],["अनुशासन प्रक्रिया — संशोधन १","सजायअघि आरोप जान्ने र आफ्नो बचाउ गर्ने अधिकार छ। निर्णय कानुनी, कारणसहित र अनुपातिक हुनुपर्छ। अनुशासनात्मक जरिवाना र तलब बिना निलम्बन लागू हुँदैन। निर्णय चुनौती दिन र स्वतन्त्र सहायता लिन सक्नुहुन्छ।"]],"rep":["José Albino — श्रमिक प्रतिनिधि","कामको समयमा आवश्यकताहरू, चिन्ता वा सुझावबारे José Albino सँग व्यक्तिगत रूपमा कुरा गर्न सक्नुहुन्छ। प्रतिनिधित्व स्वतन्त्र छ; संघ वा ACT लाई सिधै सम्पर्क गर्न सक्नुहुन्छ। एजेन्सी श्रमिकलाई पनि प्रतिनिधित्वमा सहभागी हुने अवसर दिनुपर्छ।"],"s":[["सामान्य सुरक्षा","सुरक्षा निर्देशन पालना गर्नुहोस्, खतरा र दुर्घटना सुपरिवेक्षकलाई बताउनुहोस् र शंका भए सोध्नुहोस्।"],["सुरक्षा उपकरण","बन्द जुत्ता र कामअनुसार सुरक्षा उपकरण लगाउनुहोस्। सफा र राम्रो अवस्थामा राख्नुहोस्। बदल्नुपर्ने भए जानकारी दिनुहोस्। घाम, गर्मी वा वर्षाअनुसार कपडा लगाउनुहोस्।"],["मेसिन र भार","चलिरहेका मेसिनबाट, विशेष गरी पछाडिबाट, टाढा रहनुहोस्। अवरोध र असमान जमिनबाट बच्नुहोस्। भार शरीर नजिक राखी खुट्टाको बल प्रयोग गरेर उठाउनुहोस्।"],["आपतकाल","दुर्घटना तुरुन्त सुपरिवेक्षकलाई बताउनुहोस्। आपतकालमा 112 मा फोन गर्नुहोस्। सुरक्षा संकेत र स्थानीय निर्देशन पालना गर्नुहोस्।"]],"law":"आधिकारिक स्रोत र थप जानकारी"},"HI":{"back":"मेनू पर लौटें","p":[["मानव अधिकार — संशोधन 2","अस्थायी और प्रवासी श्रमिकों सहित सभी की गरिमा का सम्मान। जबरन काम, दस्तावेज़ रोकना, बाल श्रम, भेदभाव, उत्पीड़न और भ्रष्टाचार निषिद्ध हैं। कानूनी वेतन, आराम, छुट्टी, सुरक्षा, प्रतिनिधित्व और बिना प्रतिशोध शिकायत का अधिकार।"],["संघ की स्वतंत्रता — संशोधन 2","बिना दबाव या भेदभाव यूनियन बना सकते हैं, शामिल हो सकते हैं या नहीं, प्रतिनिधि चुन सकते हैं और सामूहिक वार्ता में भाग ले सकते हैं। प्रतिनिधियों को कार्य के लिए उचित परिस्थितियाँ मिलनी चाहिए।"],["शिकायतें — संशोधन 2","A Tua Voz का उपयोग करें, पहचान देना वैकल्पिक है, या प्रतिनिधि या नियोक्ता से बात करें। ACT से सीधे संपर्क कर सकते हैं। उत्तर देखने के लिए निजी कोड सुरक्षित रखें। लक्ष्य 30 दिनों में या नौकरी/सेवा पहले समाप्त होने पर उससे पहले उत्तर देना है। कोड साझा न करें। गुमनाम रहने के लिए पहचान बताने वाली जानकारी न दें।"],["उत्पीड़न रोकथाम — संशोधन 1","अपमान, धमकी, डराना, भेदभाव और अवांछित यौन व्यवहार निषिद्ध हैं। पीड़ित और गवाह मौखिक या लिखित रूप से, गुमनाम भी, जानकारी दे सकते हैं। निष्पक्ष, गोपनीय जांच और प्रतिशोध से सुरक्षा। हितों के टकराव में स्वतंत्र संस्था से संपर्क करें।"],["अनुशासन प्रक्रिया — संशोधन 1","दंड से पहले आरोप जानने और बचाव करने का अधिकार। निर्णय कानूनी, कारणयुक्त और अनुपातिक होने चाहिए। अनुशासनात्मक जुर्माना और बिना वेतन निलंबन लागू नहीं हैं। निर्णय को चुनौती दे सकते हैं और स्वतंत्र सहायता ले सकते हैं।"]],"rep":["José Albino — श्रमिक प्रतिनिधि","काम के दौरान अपनी जरूरतों, चिंताओं या सुझावों पर José Albino से व्यक्तिगत रूप से बात कर सकते हैं। प्रतिनिधित्व स्वतंत्र है; सीधे यूनियन या ACT से संपर्क कर सकते हैं। एजेंसी श्रमिकों को भी प्रतिनिधित्व में भाग लेने का अवसर मिलना चाहिए।"],"s":[["सामान्य सुरक्षा","सुरक्षा निर्देशों का पालन करें, खतरे और दुर्घटनाएँ पर्यवेक्षक को बताएं और संदेह होने पर पूछें।"],["सुरक्षा उपकरण","बंद जूते और काम के अनुरूप सुरक्षा उपकरण पहनें। इन्हें साफ और अच्छी स्थिति में रखें। बदलने की जरूरत बताएं। धूप, गर्मी या बारिश के अनुरूप कपड़े पहनें।"],["मशीन और भार","चलती मशीनों से, विशेष रूप से पीछे से, दूर रहें। बाधाओं और असमान जमीन से बचें। भार शरीर के पास रखकर पैरों की ताकत से उठाएं।"],["आपात स्थिति","दुर्घटना तुरंत पर्यवेक्षक को बताएं। आपात स्थिति में 112 पर फोन करें। सुरक्षा संकेत और स्थानीय निर्देश मानें।"]],"law":"आधिकारिक स्रोत और अतिरिक्त जानकारी"}};
const portalSourceLinks=[['Código do Trabalho','https://diariodarepublica.pt/dr/legislacao-consolidada/lei/2009-34546475'],['CCT AHSA–SETAAB — BTE 11/2025','https://bte.dgcp.mtsss.gov.pt/completos/2025/bte11_2025.pdf'],['Retificação — BTE 15/2025','https://bte.dgcp.mtsss.gov.pt/completos/2025/bte15_2025.pdf'],['Portaria 388/2025/1','https://diariodarepublica.pt/dr/detalhe/portaria/388-2025-945692108'],['ACT','https://portal.act.gov.pt/'],['CITE','https://cite.gov.pt/'],['GLOBALG.A.P.','https://www.globalgap.org/']];
function renderLibrary2026(){const t=portalLibrary2026[document.getElementById('lang').value]||portalLibrary2026.PT;function p(root,txt){const e=document.createElement('p');e.textContent=txt;root.append(e)}function fill(id,items,notice){const root=document.getElementById(id+'Content');root.replaceChildren();items.forEach(([title,body])=>{const e=document.createElement('details');e.className='rightsDetail';const h=document.createElement('summary');h.textContent=title;e.append(h);p(e,body);e.lastElementChild.style.whiteSpace='pre-wrap';e.lastElementChild.style.overflowWrap='anywhere';root.append(e)})}const fullGraspPT=[["Política de Proteção dos Direitos Humanos — revisão 2","1. Compromisso Fundamental e Conformidade Geral\nA Finca Tropic I, S.A. assume o compromisso de proteger, promover e respeitar os direitos\nhumanos e laborais de todos os trabalhadores, incluindo permanentes, temporários,\nmigrantes e subcontratados, em condições de dignidade, justiça, igualdade, respeito e\nindependência, no âmbito do GRASP v2.\n   •   Princípios Orientadores da ONU (UNGPs): Compromisso com o respeito pelos\n       Direitos Humanos, tal como indicado nos Princípios Orientadores das Nações\n       Unidas sobre Empresas e Direitos Humanos.\n   •   Legislação aplicável: Cumprir a legislação portuguesa, incluindo o Código do\n       Trabalho, a regulamentação coletiva aplicável e as normas de segurança e saúde\n       no trabalho.\n   •   Declaração de Princípio: A empresa assume uma política clara de não causar,\n       não contribuir e não estar associada a quaisquer violações de direitos humanos,\n       promovendo ativamente condições de trabalho dignas, seguras e equitativas.\n   2. Compromissos Laborais e de Conduta (Convenções Fundamentais da\n      OIT)\nDe acordo com o nosso compromisso e em plena conformidade com as Convenções\nFundamentais da OIT, a Finca Tropic I, S.A. estabelece as seguintes garantias e\nproibições:\n   •   Trabalho forçado: Proibir trabalho forçado, servidão por dívida, coerção, retenção\n       de documentos pessoais e práticas de recrutamento que limitem a liberdade do\n       trabalhador. (OIT C29, C105, R35)\n   •   Trabalho infantil e juvenil: Proibir trabalho infantil, verificar a idade mínima legal\n       e atuar perante qualquer situação identificada. Proteger os menores de 18 anos,\n       quando legalmente admitidos, de tarefas perigosas e trabalho noturno, sem\n       prejuízo da escolaridade. (OIT C138, R146, C182, R190)\n   •   Discriminação e Igualdade: É proibida e não tolerada qualquer forma de\n       discriminação nas práticas de emprego e ocupação. É garantida a igualdade de\n       oportunidades e tratamento, assegurando remuneração igual para trabalho de\n       igual valor. (OIT C100, C111, R90, R111)\n   •   Liberdade de Associação e Negociação Coletiva: É assegurado o direito dos\n       trabalhadores de se organizarem, aderirem a estruturas representativas e\n       participarem em processos de negociação coletiva, sem interferência ou\n       represálias. (OIT C87, C98)\n   •   Condições de Trabalho e Segurança: São asseguradas condições de trabalho\n       seguras, dignas e higiénicas, através de avaliações de risco e formação adequada,\n       sob um sistema de inspeção do trabalho. A empresa contribui para políticas ativas\n       de promoção do pleno emprego. (OIT C81, C122)\n   •   Assédio e Abuso: Não é tolerado o uso ou ameaça de castigo corporal, coerção\n       mental ou física, bullying, assédio ou abuso de qualquer natureza.\n\n•   Corrupção: A empresa proíbe qualquer envolvimento em atos de corrupção,\n    extorsão, peculato, bem como em qualquer forma de suborno, seja de forma direta\n    ou indireta.\n•   Remunerações: Garantir o salário mínimo legal ou convencional aplicável à\n    categoria, consoante o valor mais elevado, incluindo no trabalho à peça; pagar\n    pontualmente os salários, suplementos e benefícios devidos e fornecer recibos\n    discriminados.\n•   Tempos de trabalho: Registar as horas efetivas de início, fim e intervalos,\n    conservar os registos pelo menos cinco anos e respeitar os limites legais,\n    descansos, férias e regras de trabalho suplementar, incluindo a sua remuneração.\n    Não recorrer a trabalho suplementar coercivo.\n•   Licenças e proteção social: Respeitar os direitos a férias, parentalidade, doença\n    e demais ausências e prestações legais, sem discriminação ou represálias.\n•   Disciplina e bem-estar: Aplicar procedimentos disciplinares legais e justos, com\n    direito de defesa e sem deduções salariais disciplinares proibidas pelo GRASP.\n    Quando disponibilizados, o alojamento e o transporte devem cumprir as condições\n    legais de segurança e dignidade.\n3. Gestão de Responsabilidade e Queixas\n•   Processo confidencial de queixa: Todos os trabalhadores podem apresentar\n    reclamações e sugestões, inclusive anonimamente, através da webapp Persea —\n    A Tua Voz (https://perseagrowers.github.io/a-tua-voz/), contactar o representante\n    dos trabalhadores ou do empregador, ou recorrer diretamente à ACT e demais\n    entidades competentes. É proibida qualquer retaliação. As comunicações são\n    tratadas em tempo útil, segundo o Procedimento de Reclamação e Gestão de\n    Queixas em vigor, com acesso restrito aos dados e possibilidade de consultar a\n    resposta por código privado.\n•   Diligência devida e melhoria contínua: Identificar riscos para os direitos\n    humanos, verificar as práticas laborais, investigar situações reportadas, corrigir\n    incumprimentos e acompanhar a eficácia das medidas adotadas.\n4. Parceiros de Negócio e Não Conformidade\n•   Parceiros: Comunicar esta política às empresas de trabalho temporário e demais\n    prestadores de mão de obra agrícola, exigir o cumprimento dos mesmos\n    compromissos e verificar as condições de emprego, remunerações, horários e\n    legalidade do recrutamento. Informar os restantes subcontratados e visitantes da\n    tolerância zero a violações de direitos humanos.\n•   Comunicação: Disponibilizar e explicar a política aos trabalhadores diretos e\n    subcontratados em língua que compreendam, informar todos os supervisores e\n    conservar evidências adequadas dessa comunicação.\n\n   •   Revisão: Rever a política pelo menos de três em três anos ou antes, se houver\n       alterações relevantes na legislação laboral ou no GRASP, consoante o que ocorrer\n       primeiro.\n   •   Não Conformidade: A empresa aceita que se uma verificação de avaliação GRASP\n       demonstrar qualquer violação desta política, tal será considerada uma Não\n       Conformidade com este Ponto e Critério (P&C)."],["Política de Liberdade de Associação, Organização e Representação — revisão 2","I. COMPROMISSO E PRINCÍPIOS FUNDAMENTAIS\n\nA Finca Tropic I, S.A. está firmemente empenhada em respeitar e proteger\nos direitos humanos e laborais de todos os seus colaboradores, incluindo\ntrabalhadores permanentes, temporários e subcontratados. Reconhecemos\no direito inalienável de todos os indivíduos à Liberdade de Associação e\nOrganização, conforme estabelecido na Constituição da República\nPortuguesa e no Código do Trabalho.\n\nA Nossa Declaração:\n\n   •   Liberdade Sindical: A Finca Tropic I, S.A. reconhece o direito de\n       todos os trabalhadores a criar, aderir ou participar em sindicatos ou\n       outras organizações de trabalhadores à sua escolha, bem como a não\n       aderir ou participar, sem interferência da empresa.\n\n   •   Negociação Coletiva: Respeitamos o direito à negociação coletiva e\n       comprometemo-nos a interagir de boa-fé com representantes\n       legalmente eleitos.\n\n   •   Aplicação: Esta política aplica-se a todas as áreas e locais de trabalho\n       geridos pela Finca Tropic I, S.A.\n\nII. GARANTIA DE REPRESENTAÇÃO E VOZ DOS TRABALHADORES\n\nPara garantir que a voz dos trabalhadores é ouvida e considerada pela\ngerência em todos os assuntos laborais, implementamos os seguintes\nmecanismos:\n\n1. Representação e Ponto de Contacto\n\n   •   José Albino é o representante eleito em 2024 para a Segurança e\n       Saúde no Trabalho. A sua continuidade como representante GRASP\n       depende da decisão livre dos trabalhadores atuais em cada ano ou\n       ciclo produtivo, a documentar separadamente.\n  •   O Representante dos Trabalhadores, José Albino, atua como o elo\n      principal entre a força de trabalho e a gerência em questões\n      relacionadas com condições de trabalho, segurança e bem-estar.\n\n  •   O nome, a função e a forma de contactar o representante durante o\n      horário de trabalho são comunicados aos trabalhadores, em locais\n      acessíveis e no Portal do Trabalhador, sem divulgar contactos\n      pessoais sem autorização.\n\n2. Apoio à Função do Representante\n\n  •   A gerência compromete-se a apoiar o representante escolhido pelos\n      trabalhadores, respeitando a sua independência.\n\n  •   O representante dispõe de acesso aos trabalhadores, tempo e local\n      apropriados para exercer as suas funções. É igualmente permitido o\n      acesso ao local de trabalho a representantes sindicais e outras\n      estruturas representativas legalmente reconhecidas, nos termos da\n      legislação aplicável.\n\n3. Informação e Direitos\n\n  •   Todos os trabalhadores são informados do direito de constituir\n      comissões de trabalhadores e associações sindicais, de aderir ou não\n      a estas e de exercer os direitos de representação (Código do Trabalho,\n      artigo 440.º). Os contactos sindicais relevantes são disponibilizados\n      ao representante e aos trabalhadores.\n\n  •   A informação é comunicada na admissão e sempre que necessário,\n      em língua compreendida pelo trabalhador, incluindo português,\n      inglês, espanhol, nepali e hindi, com apoio verbal quando necessário.\n\n4. Proibição de Retaliação e Discriminação\n\n  •   A Finca Tropic I, S.A. proíbe qualquer discriminação, intimidação ou\n      retaliação    por   filiação   ou   não   filiação    sindical,   atividade\n      representativa,     candidatura     ou    exercício     de   funções      de\n      representação.\n   •   Nenhum trabalhador será desfavorecido ou terá a sua remuneração,\n       horário de trabalho ou posição comprometida por exercer os seus\n       direitos de representação ou associação.\n\n   •   Qualquer   violação   pode   ser   comunicada    confidencialmente,\n       inclusive de forma anónima, através do Portal do Trabalhador — A\n       Tua     Voz      (https://perseagrowers.github.io/a-tua-voz/),     ao\n       representante dos trabalhadores ou diretamente à ACT ou sindicato,\n       sem autorização prévia da empresa e sem represálias.\n\nIII. APROVAÇÃO E COMUNICAÇÃO\n\nA Finca Tropic I, S.A. compromete-se a comunicar e implementar esta\npolítica junto de todos os trabalhadores, incluindo os subcontratados. A\nversão aprovada será disponibilizada no Portal do Trabalhador, sem\nprejuízo da informação presencial e das obrigações legais de afixação."],["Procedimento de Reclamação e Gestão de Queixas — revisão 2","I. DECLARAÇÃO DE PRINCÍPIOS E GARANTIA\nA Finca Tropic I, S.A. garante a todos os trabalhadores, permanentes,\ntemporários e subcontratados, o acesso a um processo confidencial de\nreclamações e sugestões, sem represálias, penalidades ou prejuízo do direito\nde recorrer às autoridades e aos tribunais.\n   •   Acessibilidade e simplicidade: A informação é disponibilizada em\n       português, inglês, espanhol, nepali e hindi. Quando necessário, são\n       prestadas instruções verbais ou visuais numa língua compreendida pelo\n       trabalhador.\n   •   Reclamações verbais: São aceites, incluindo as resolvidas de imediato,\n       com registo do assunto e da pessoa que as resolveu. O trabalhador pode\n       solicitar anonimato ou apoio na apresentação.\n\nII. CANAIS DE SUBMISSÃO E ACESSIBILIDADE\nO canal principal é a webapp Persea — A Tua Voz\n(https://perseagrowers.github.io/a-tua-voz/), acessível por QR Code, sem\nconta Google. A identificação é facultativa. A comunicação pessoal mantém-\nse como alternativa.\nCanais disponíveis: O trabalhador pode escolher livremente qualquer uma das\nvias abaixo, incluindo o recurso direto a um canal independente, sem autorização\nda empresa.\n\n                                                              Independência\n Canal de Queixa             Tipo de Submissão\n                                                              da Supervisão\n\n 1. Representante dos        Pessoal ou por                   Sim, desde que\n Trabalhadores: José         representação; anonimato a       não exerça\n Albino                      pedido                           supervisão\n\n 2. Autoridade para as                                        Sim —\n                             Externa; confidencial\n Condições do                                                 autoridade\n                             segundo regras da ACT\n Trabalho (ACT)                                               independente\n\n 3. Contacto Direto\n com a Representante         Pessoal ou por escrito;          Não — canal\n do Empregador               anonimato a pedido               interno\n (Marta Martins)\n4. Webapp Persea — A Tua Digital; anónima por defeito ou     Não — canal interno\nVoz                      identificada\nDivulgação e Instruções\n   •   Afixar instruções e QR Code em locais acessíveis, incluindo zonas de\n       descanso, e divulgar os contactos externos. No campo, o\n       representante ou pessoa designada deve estar acessível para apoiar a\n       apresentação de reclamações, incluindo anónimas. Informar os\n       trabalhadores do local dos avisos e dos canais alternativos.\n   •   Trabalhadores novos: Explicar o mecanismo no acolhimento, incluindo\n       às ETT e respetivos trabalhadores. Conservar evidência da divulgação e\n       assegurar a compreensão das instruções.\n\nIII. O PAPEL DA REPRESENTAÇÃO DOS TRABALHADORES (3.3 E 3.5)\nO Representante dos Trabalhadores (José Albino) deve receber instruções\ndocumentadas sobre a utilização do mecanismo e as responsabilidades\nseguintes:\n   1. Confidencialidade: O Representante tem a obrigação de manter toda\n      a informação confidencial.\n\n   2. Autorização: Só pode apresentar uma queixa em nome de outro\n      trabalhador se tiver o seu consentimento expresso (documento de\n      consentimento arquivado, se aplicável).\n   3. Anonimato: Se o Representante for solicitado a agir para proteger o\n      anonimato do queixoso, a gestão deve respeitar o pedido e garantir\n      que isso não afeta o resultado da queixa.\n   4. Notificação: A representante do empregador informa José Albino da\n      receção e do resultado das reclamações, sem transmitir a identidade nem\n      pormenores que permitam identificar o trabalhador.\n   5. Apoio: Se o representante não puder atuar, o trabalhador pode procurar\n      apoio independente, incluindo a ACT, sem passar pela gestão. A empresa\n      disponibiliza os contactos necessários.\n\nIV. RESOLUÇÃO E PRAZOS\nA representante do empregador coordena a análise, encaminha as situações\ne acompanha os prazos. A Gerência e os RH asseguram os meios e as\ndecisões necessários. Os assuntos urgentes de segurança ou risco de\nrepresália exigem intervenção imediata; em emergência, ligar 112.\nPrazos de Resolução\n   •   Trabalhadores diretos: Procurar concluir a análise e comunicar a\n       decisão em até 30 dias, ou antes do último dia de emprego, se anterior.\n   •   Trabalhadores subcontratados: Aplicar o mesmo limite de 30 dias ou o\n       último dia do contrato de prestação de serviços, se anterior. Ajustar\n       manualmente o prazo automático da folha quando necessário.\nTratamento da Resolução\n   1. Resposta: Comunicar a decisão fundamentada, as ações adotadas ou a\n      razão pela qual não foi possível resolver. Utilizar uma língua compreendida\n      pelo trabalhador.\n   2. Queixas anónimas: Na webapp, o trabalhador guarda o código privado\n      para consultar a resposta. Publicar também um aviso geral da resposta\n      nos locais de informação dos trabalhadores, sem nomes nem detalhes\n      identificativos. Não publicar informação sensível.\n   3. Atrasos: Registar a causa, a previsão de conclusão e a comunicação ao\n      trabalhador. Se a identificação for voluntária, utilizar o contacto indicado;\n      se anónimo, disponibilizar a atualização pelo canal adequado.\n\nReclamações de Trabalhadores Subcontratados\n   •   Dentro do contrato comercial: A Finca Tropic investiga as condições no\n       local, articula com a ETT e acompanha a resolução.\n   •   Fora do contrato comercial: Informar sobre os recursos legais e oficiais,\n       incluindo a ACT, e encaminhar para o empregador direto quando\n       adequado, sem divulgar a identidade sem fundamento legítimo.\n       Acompanhar as obrigações próprias da Finca Tropic.\n\nV. REGISTO E ARQUIVO\nA representante do empregador mantém o registo privado das\ncomunicações, ações corretivas e monitorização. As submissões digitais são\nregistadas automaticamente; as restantes são registadas manualmente. Os\ntestes são identificados e arquivados separadamente.\n   •   Retenção: Conservar o resumo das reclamações durante pelo menos 24\n       meses. Rever a necessidade de conservar dados pessoais adicionais e\n       eliminar os que deixem de ser necessários, sem prejuízo de obrigações\n       legais ou processos pendentes.\nConteúdo Mínimo do Registo\nO registo deve permitir acompanhar a receção, o tratamento e a decisão,\nincluindo:\n   •   Número de Registo e Data de Receção.\n   •   Descrição da Queixa (ou tópico, se verbal/resolvida de imediato).\n   •   Identificação apenas quando voluntária e necessária; indicação de\n       anonimato.\n   •   Ação Corretiva/Resolução Final e Decisão.\n   •   Tempo de Resolução.\n   •   Evidência da comunicação da decisão (data de disponibilização na\n       webapp, aviso geral ou outro meio); não presumir que a resposta foi\n       lida.\n\nVI. CONFIDENCIALIDADE, MONITORIZAÇÃO E APROVAÇÃO\nAs notificações digitais são remetidas à representante do empregador (Marta\nMartins), aos técnicos Gonçalo Ramires e Alexandre Loução e à Diretora de\nRH (D. González). Os quatro recebem o conteúdo da comunicação; apenas\npessoas autorizadas consultam o registo privado. Não encaminhar\n\nindiscriminadamente, nem utilizar a informação para represálias. Se a queixa\nenvolver um destinatário, este não deve participar na investigação ou\ndecisão; o trabalhador pode utilizar diretamente o canal independente.\nPrivacidade: A webapp não solicita autenticação nem recolhe\ndeliberadamente IP ou localização. Os serviços de alojamento podem\nconservar registos técnicos. O trabalhador deve evitar informações\nidentificativas se pretender anonimato. O código privado é armazenado sob\nforma de hash e não é enviado nas notificações. Os dados são tratados para\ngerir a comunicação e cumprir obrigações aplicáveis; os pedidos de direitos\nde proteção de dados podem ser dirigidos à empresa através de\nmmartins@perseagrowers.com.\nMonitorização: Registar as verificações do funcionamento, inclusive quando\nnão existam reclamações. Se o formulário estiver indisponível, encaminhar\npara o representante dos trabalhadores ou a ACT. Não criar reclamações\nfictícias como evidência de utilização real.\nEntrada em vigor: Após aprovação da Gerência, validação da informação de\nprivacidade e divulgação aos trabalhadores e ETT, ativar o modo de\nprodução. A versão de 2025 permanece arquivada.\nReferência: GLOBALG.A.P. GRASP v2.0_Sep22, secção 3, critérios 3.1 a 3.7\n(páginas 12–19)."],["Código de Boa Conduta — Prevenção do Assédio — revisão 1","1. Objetivo e âmbito\nA Finca Tropic I, S.A. e a Extraissol, Lda. adotam uma política de tolerância zero ao assédio, à\nviolência e à discriminação. Este código aplica-se a trabalhadores diretos, temporários, chefias,\ngerência, prestadores de serviços e visitantes, nas explorações e nas relações profissionais,\nincluindo comunicações digitais.\n2. O que é o assédio?\nÉ um comportamento indesejado que tem por objetivo ou efeito perturbar ou constranger uma\npessoa, afetar a sua dignidade ou criar um ambiente intimidativo, hostil, degradante, humilhante\nou desestabilizador. O assédio sexual envolve comportamentos indesejados de caráter sexual,\nverbais, não verbais ou físicos. A avaliação depende dos factos e do contexto.\n3. Condutas proibidas\nInsultos, ameaças, humilhações, intimidação, isolamento abusivo, comentários discriminatórios,\ncontactos físicos indesejados, propostas sexuais não desejadas ou pressão para obter favores\nsexuais. É igualmente proibida qualquer represália. A gestão legítima do trabalho, exercida com\nrespeito e proporcionalidade, não constitui por si só assédio.\n4. Prevenção e responsabilidades\nAs chefias devem promover relações respeitadoras, intervir perante comportamentos\ninadequados e comunicar situações de risco. Todos devem respeitar os colegas, colaborar no\nesclarecimento dos factos e manter a confidencialidade. A empresa assegura divulgação e\ninformação em linguagem compreensível, incluindo às ETT.\n5. Como comunicar\nQualquer pessoa afetada ou testemunha pode comunicar verbalmente ou por escrito, incluindo\nanonimamente, no Portal A Tua Voz: https://perseagrowers.github.io/a-tua-voz/. Pode ainda\ncontactar o representante dos trabalhadores, Recursos Humanos ou diretamente a ACT (300 069\n300) e a CITE (800 204 684), sem autorização prévia. Se um destinatário estiver envolvido, deve\nrecorrer a um canal independente. Em perigo imediato, ligar 112.\n6. Tratamento, proteção e consequências\nCada empregador instaura procedimento disciplinar quando tenha conhecimento de alegadas\nsituações de assédio no trabalho, nos termos legais. A averiguação deve ser célere, imparcial e\nreservada, com afastamento de intervenientes em conflito de interesses, proteção adequada das\npessoas e respeito pelo contraditório. Em casos de ETT, articula-se com o empregador\ncompetente. Os factos comprovados podem originar sanções legais proporcionais, sem prejuízo\nde outras responsabilidades. Não há represálias por comunicações de boa-fé; denunciante e\ntestemunhas beneficiam da proteção do artigo 29.º, n.º 6, do Código do Trabalho. O acesso aos\nregistos é limitado a quem necessite deles.\n7. Divulgação e revisão\nO código será divulgado no Portal do Trabalhador após aprovação por ambas as empresas,\nexplicado na admissão e revisto perante alterações legais ou necessidades identificadas.\nReferências: Código do Trabalho, artigos 29.º, 127.º, n.º 1, alíneas k) e l), e 283.º; Lei n.º 73/2017;\nPolítica de Direitos Humanos e Procedimento de Reclamações."],["Procedimento Disciplinar — revisão 1","1. Objetivo e âmbito\nAssegurar o tratamento justo, proporcional e confidencial de eventuais infrações disciplinares na\nFinca Tropic I, S.A. e na Extraissol, Lda. O procedimento aplica-se aos trabalhadores diretos.\nQuanto aos trabalhadores temporários ou subcontratados, os factos são comunicados ao\nrespetivo empregador, a quem compete o exercício do poder disciplinar.\n2. Condutas e prevenção\nO incumprimento culposo dos deveres laborais, nomeadamente das regras de segurança,\nrespeito pelos colegas, assiduidade e instruções legítimas, pode ser objeto de avaliação\ndisciplinar. Privilegia-se o esclarecimento e a orientação quando adequados, sem prejuízo da\nobrigação legal de instaurar procedimento perante alegadas situações de assédio.\n3. Tramitação e direito de defesa\nA chefia comunica os factos aos Recursos Humanos ou à gerência da entidade empregadora.\nSão registados os factos, recolhidas as evidências e ouvidas as pessoas relevantes, evitando\nconflitos de interesses. O trabalhador é informado dos factos imputados e dispõe de oportunidade\nefetiva de se defender antes de qualquer sanção. São respeitados os prazos legais, a\nconfidencialidade e os procedimentos especiais, incluindo os previstos para eventual\ndespedimento por justa causa.\n4. Decisão e medidas disciplinares\nA decisão compete ao empregador ou a quem detenha poderes delegados. Qualquer sanção\ndeve ser legal, fundamentada e proporcional à gravidade da infração e à culpa, não podendo\naplicar-se mais de uma sanção pela mesma infração. Podem ser aplicadas repreensão ou\nrepreensão registada e, em situações graves, outras medidas legalmente admissíveis\ncompatíveis com o GRASP. É proibido efetuar descontos no salário como medida disciplinar. Não\nsão aplicadas multas disciplinares nem suspensão com perda de retribuição.\n5. Garantias e reclamações\nSão proibidas punições físicas, humilhações, discriminação, intimidação e represálias pelo\nexercício de direitos, reclamações legítimas ou atividade sindical. O trabalhador pode contestar a\ndecisão pelos meios legais e procurar apoio do representante dos trabalhadores, sindicato ou\nACT, sem autorização da empresa. Portal: https://perseagrowers.github.io/a-tua-voz/.\n6. Registos e acompanhamento\nOs processos e sanções aplicadas são registados e conservados em arquivo reservado, com\nacesso limitado aos responsáveis autorizados, nos termos legais. O registo de sanções é mantido\natualizado (art. 332.º do Código do Trabalho). A inexistência de processos não dispensa a\ndivulgação do procedimento.\n7. Divulgação e referências\nApós aprovação, o procedimento é comunicado aos trabalhadores e às ETT em língua\ncompreensível, incluindo através do Portal do Trabalhador. Referências: Código do Trabalho, arts.\n127.º, 328.º–332.º e 351.º–358.º; CCT AHSA–SETAAB aplicável; GRASP v2, critérios 13.1 e 13.2."],["Comunicação interna — Avaliação GRASP 2026","AVALIAÇÃO GRASP 2026 — INFORMAÇÃO AOS TRABALHADORES\nA Finca Tropic I, S.A. e a Extraissol, Lda. informam os trabalhadores diretos e\nsubcontratados sobre a próxima avaliação GLOBALG.A.P. Risk Assessment on Social\nPractice (GRASP), relativa às práticas sociais e condições de trabalho.\n1. O que será avaliado?\nA avaliação abrange liberdade de associação, representação dos trabalhadores,\nreclamações, direitos humanos, condições de emprego, salários, horários, descansos,\nproteção de menores e procedimentos disciplinares.\n2. Participação dos trabalhadores\nOs trabalhadores podem ser convidados a conversar com o avaliador. Podem\nresponder livremente e com sinceridade, sem interferência da empresa nem receio de\nrepresálias. Podem também contactar José Albino, representante dos trabalhadores,\ndurante o horário de trabalho.\n3. Onde consultar a informação?\nPortal do Trabalhador — A Tua Voz\nhttps://perseagrowers.github.io/a-tua-voz/\nO portal é acessível através do QR Code divulgado nas explorações e dispõe de\ninterface em português, inglês, espanhol, nepali e hindi. Inclui direitos laborais,\ncontactos de apoio e o canal de reclamações e sugestões. As políticas aprovadas\nserão disponibilizadas progressivamente. A documentação aplicável pode também ser\nconsultada junto do representante ou da administração.\n4. Reclamações e apoio independente\nPodes apresentar uma reclamação ou sugestão, com ou sem identificação, e consultar\na resposta através do código privado. Podes igualmente recorrer diretamente à ACT\n(300 069 300) ou a outras entidades de apoio, sem autorização da empresa.\nA informação será comunicada aos trabalhadores numa língua que compreendam,\nincluindo os trabalhadores das ETT."],["Instrução do Representante GRASP","Objetivo e âmbito\nRepresentante: José Albino (sujeito à confirmação pelos trabalhadores no ciclo 2026).\nEntidade: Finca Tropic I, S.A. Abrange trabalhadores diretos e subcontratados.\nFunções, direitos e responsabilidades\n• Escutar os trabalhadores, recolher preocupações e transmitir propostas à empresa, sem\ndiscriminação.\n• Participar na avaliação GRASP, apoiar a comunicação dos direitos laborais e\nacompanhar ações corretivas.\n• Promover reuniões mensais no período de maior presença de trabalhadores, incluindo a\nparticipação dos trabalhadores e da empresa, e documentar os assuntos e decisões.\n• Apoiar a apresentação de reclamações, incluindo verbais e anónimas, sem revelar a\nidentidade sem autorização. Conhecer o procedimento e acompanhar a resolução.\n• Ter acesso aos trabalhadores, tempo e local adequados para exercer as funções, sem\ninterferências ou represálias.\n• Informar sobre os canais independentes, incluindo ACT e sindicatos; não impedir o\nacesso direto a estes canais.\nPortal: https://perseagrowers.github.io/a-tua-voz/ — permite apresentar reclamações e\nconsultar respostas por código privado. Não solicitar códigos privados aos trabalhadores."],["Declaração de compromisso dos parceiros e ETT — revisão 2","II. COMPROMISSO E RECONHECIMENTO\nA Finca Tropic I, S.A. disponibiliza à entidade parceira identificada os\ndocumentos indicados acima. A assinatura confirma a sua receção e o\ncompromisso de os aplicar nas atividades contratadas.\nO representante da entidade parceira confirma ter recebido e compreendido\nos seguintes compromissos:\nA. Para TODOS os Subcontratados e Visitantes (Tolerância Zero)\nA entidade parceira reconhece a política de tolerância zero relativamente a\nviolações dos direitos humanos e da legislação laboral e social aplicável.\nO parceiro compromete-se a:\n   1. Cumprir integralmente todas as leis locais e nacionais enquanto\n      estiverem nas instalações da Finca Tropic I, S.A.\n\n   2. Garantir que os seus colaboradores/representantes presentes na\n      exploração cumprem as normas de conduta e respeitam os Direitos\n      Humanos.\nB. Para Subcontratados de Mão-de-Obra (Obrigatório)\nA entidade fornecedora de mão de obra compromete-se a:\n   1. Disponibilizar e explicar a política e o procedimento aos seus\n      trabalhadores, em língua que compreendam, antes do início da\n      atividade ou, para os atuais trabalhadores, após a receção desta revisão.\n   2. Divulgar      o     portal      Persea      —        A    Tua    Voz\n      (https://perseagrowers.github.io/a-tua-voz/), incluindo o QR Code, o\n      envio anónimo ou identificado e a consulta privada de respostas.\n      Informar sobre o acesso direto ao representante dos trabalhadores e à\n      ACT.\n   3. Garantir a ausência de represálias, cumprir as obrigações laborais e\n      disponibilizar evidências de conformidade para verificação, respeitando\n      a proteção de dados pessoais.\n\nIII. RECONHECIMENTO DOCUMENTAL\nPela assinatura, as partes confirmam a comunicação e receção dos\ndocumentos na data indicada abaixo. A entidade parceira compromete-se a\ndivulgar as atualizações aos seus trabalhadores e a cooperar na resolução de\neventuais não conformidades."],["Declaração de Conhecimento e Compreensão — GRASP","Cada trabalhador confirma, mediante assinatura, que recebeu ou consultou a informação\nabaixo, que esta lhe foi explicada numa língua que compreende e que teve oportunidade de\nesclarecer dúvidas:\n• Política de Direitos Humanos e Política de Liberdade de Associação;\n• Código de Boa Conduta e prevenção do assédio; procedimento disciplinar;\n• Guia dos Direitos Laborais 2026 e comunicação da avaliação GRASP;\n• Procedimento de reclamações, anonimato, não retaliação e apoio externo;\n• Portal do Trabalhador: acesso, escolha do idioma e consulta por código privado.\nPortal: https://perseagrowers.github.io/a-tua-voz/\nA assinatura confirma a informação efetivamente comunicada e não constitui renúncia a\ndireitos."],["Guia dos Direitos Laborais — 2026","1. Remunerações mínimas — 2026\nInformação para trabalhadores diretos e temporários da Finca Tropic I, S.A. e Extraissol, Lda.\nValores brutos mensais para tempo completo, quando abrangidos pelo CCT AHSA–SETAAB.\nO mínimo nacional em Portugal continental é 920 €; o nível 11 do CCT corresponde a 925 €\n(SMN + 5 €).\n Nível   Categoria profissional                                                  Mínimo\n 1       Diretor geral                                                           1 480 €\n 2       Diretor de serviços                                                     1 250 €\n 3       Gestor de área; técnico oficial de contas                               1 200 €\n 4       Técnico superior ou especialista de área                                1 100 €\n 5       Assistente de produção; coordenador de área                             1 060 €\n 6       Técnico de área                                                         1 050 €\n 7       Encarregado de armazém; secretário de direção                           1 030 €\n 8       Assistente administrativo; supervisor de área; auxiliar de técnico de   985 €\n         manutenção\n 9       Chefe de equipa                                                         960 €\n 10      Operador de máquinas agrícolas; aplicador de fitofármacos e             950 €\n         adubos; apontador; assistente de supervisão; motorista\n 11      Empregado de armazém; guarda de propriedade; operador de                925 €\n         limpeza industrial, de linha de produção ou de rega; trabalhador\n         agrícola; ajudante de armazém; trabalhador auxiliar\nFonte: Anexo III, tabela B, retificação no BTE 15/2025, p. 160; DL 139/2025. A categoria deve\ncorresponder às funções exercidas. A remuneração variável ou à peça não elimina o mínimo\naplicável (cl. 57.ª).\n\n2. Pagamento e subsídios\nRecebe um recibo discriminado com salário, suplementos, descontos e valor líquido. O\npagamento é devido no mês respetivo; o CCT prevê pagamento até dia 10 do mês seguinte\nse existir consentimento expresso no contrato ou aditamento (cl. 59.ª). Alimentação: 6 € por\ndia efetivamente trabalhado, quando ultrapassada metade do período normal diário (cl. 66.ª).\n\n3. Horários, pausas e descansos\nRegra normal: 8 h/dia e 40 h/semana, distribuídas de segunda a sábado. Intervalo de 30\nminutos a 2 horas; normalmente não mais de 5 h consecutivas (6 h se o período diário\nexceder 10 h). Descanso diário, em regra, 11 horas consecutivas. Descanso semanal\nobrigatório ao sábado ou domingo, podendo mudar durante a campanha. Registar as horas\nefetivas, incluindo entradas, saídas e pausas. (CCT cl. 18.ª, 25.ª, 26.ª e 36.ª; CT art. 202.º.)\n\n4. Trabalho suplementar (horas extra)\nDeve existir motivo legal e registo. Limites gerais do CCT: 200 h/ano e 2 h em dia normal,\nsalvo força maior e demais limites legais; a tempo parcial aplica-se a proporcionalidade\nprevista na cláusula 31.ª. Pode pedir dispensa por motivo atendível. Não é admissível\ntrabalho coercivo.\n Acréscimo sobre a hora          Até 100 h/ano                    Acima de 100 h/ano\n normal\n Dia útil — primeira hora        25%                              50%\n Dia útil — horas seguintes      37,5%                            75%\n Descanso semanal ou feriado     50%                              100%\n — cada hora\nOs valores por cada hora de descanso ou feriado decorrem do art. 268.º CT, que prevalece\nsobre redação menos favorável. Trabalho em descanso semanal obrigatório dá direito a um\ndia de descanso compensatório remunerado num dos três dias úteis seguintes. (CCT cl.\n28.ª–33.ª, 60.ª.)\n\n5. Trabalho noturno, isenção e adaptabilidade\nTrabalho noturno: 20h–7h, com acréscimo de 25% (cl. 34.ª e 67.ª). Isenção de horário: exige\nacordo escrito e modalidade legal; cl. 62.ª prevê 25% da retribuição mínima para não\nsujeição aos limites normais e 5–10% nas restantes situações, sem prejuízo de garantias\nlegais aplicáveis. Descanso semanal e feriados não ficam abrangidos pela isenção para\nefeitos de pagamento de horas extra.\nAdaptabilidade (cl. 19.ª): até mais 2 h/dia e 50 h/semana, com média do período normal em\nseis meses e compensação equivalente. O horário deve ser comunicado com 15 dias de\nantecedência e consulta prévia ao SETAAB. Banco de horas só quando instituído\nlegalmente, com registos e compensações próprias (cl. 21.ª). Não confundir com horas extra.\n\n6. Férias e feriados\n22 dias úteis anuais; o CCT prevê mais 2 dias até duas faltas justificadas (ou quatro meios-\ndias), ou mais 1 até três faltas (ou seis meios-dias), incluindo a condição de assiduidade da\ncl. 40.ª. No ano de admissão: 2 dias úteis por mês, até 20, em regra após seis meses. Férias\npagas e subsídio de férias; subsídio de Natal equivalente a um mês de retribuição,\nproporcional quando aplicável. Carnaval e feriado municipal também estão previstos no CCT.\n(cl. 37.ª, 39.ª–42.ª, 63.ª–64.ª.)\n\n7. Faltas, doença, parentalidade e proteção social\nComunica ausências ao empregador e entrega comprovativo quando exigido. Faltas\njustificadas não são necessariamente remuneradas. A doença pode dar acesso a subsídio da\nSegurança Social, mediante condições legais. Pais e mães têm direito a licenças, dispensas\ne proteção especial nos termos do Código do Trabalho e do regime de Segurança Social.\nConsulta seg-social.pt e cite.gov.pt para condições específicas. (CT arts. 33.º–65.º, 248.º–\n257.º.)\n\n8. Formação e condições de emprego\nDireito a 40 horas anuais de formação contínua; contratos a termo de três meses ou mais:\nproporcional. Formação certificada e crédito nos termos legais (CCT cl. 7.ª–9.ª; CT arts.\n131.º–132.º). Direito a informação escrita sobre condições de emprego, função, horário,\nremuneração, férias e instrumento coletivo aplicável (CT arts. 106.º–107.º).\n\n9. Trabalhadores temporários e migrantes\nTrabalhadores de ETT têm direito às condições de trabalho e à remuneração mais favorável\nprevista no art. 185.º do CT, incluindo os mínimos aplicáveis à função. Devem receber\ninformação compreensível, ter acesso aos canais de apoio e poder apresentar reclamações.\nNão é permitido reter documentos pessoais nem impor trabalho forçado.\n\n10. Igualdade, segurança e representação\nIgualdade de tratamento e remuneração por trabalho de igual valor; proibição de\ndiscriminação, assédio e represálias. Direito a aderir ou não a sindicatos e escolher\nrepresentantes. Direito a condições seguras, informação, formação e EPI adequados sem\ncustos, e a comunicar perigos. (CT arts. 23.º–29.º, 127.º, 281.º, 440.º; Lei 102/2009.)\n\n11. Reclamações e contactos\nPortal A Tua Voz: https://perseagrowers.github.io/a-tua-voz/ — reclamações e sugestões,\ncom identificação facultativa e consulta por código privado. Também podes contactar José\nAlbino, representante dos trabalhadores, ou diretamente a ACT (300 069 300), SETAAB (213\n931 200 / 937 955 329), CITE (800 204 684) ou Segurança Social (300 502 502).\nEmergência: 112.\n\nFontes e controlo de atualização\nCCT AHSA–SETAAB, BTE 11/2025, pp. 17–54:\nhttps://bte.dgcp.mtsss.gov.pt/completos/2025/bte11_2025.pdf\nRetificação BTE 15/2025, pp. 159–160; Portaria 388/2025/1, de 12/11; Código do Trabalho\n(Lei 7/2009, redação vigente); DL 139/2025. Informação revista em 24/11/2026. Guia\ninformativo: não substitui a lei nem condições mais favoráveis. Rever em janeiro de 2027 ou\nquando houver alterações legais."]];const fullGraspES=[["Política de Protección de los Derechos Humanos — revisión 2","1. Compromiso fundamental y conformidad general\nFinca Tropic I, S.A. se compromete a proteger, promover y respetar los derechos humanos y laborales de todos los trabajadores, incluidos los permanentes, temporales, migrantes y subcontratados, en condiciones de dignidad, justicia, igualdad, respeto e independencia, en el marco de GRASP v2.\n• Principios Rectores de la ONU (UNGPs): compromiso de respetar los derechos humanos conforme a los Principios Rectores de las Naciones Unidas sobre las Empresas y los Derechos Humanos.\n• Legislación aplicable: cumplir la legislación portuguesa, incluido el Código del Trabajo, la normativa colectiva aplicable y las normas de seguridad y salud en el trabajo.\n• Declaración de principios: la empresa adopta una política clara de no causar, contribuir ni estar asociada a ninguna vulneración de los derechos humanos, promoviendo activamente condiciones laborales dignas, seguras y equitativas.\n\n2. Compromisos laborales y de conducta (convenios fundamentales de la OIT)\nDe acuerdo con nuestro compromiso y en plena conformidad con los convenios fundamentales de la OIT, Finca Tropic I, S.A. establece las siguientes garantías y prohibiciones:\n• Trabajo forzoso: prohibir el trabajo forzoso, la servidumbre por deudas, la coacción, la retención de documentos personales y las prácticas de contratación que limiten la libertad del trabajador. (OIT C29, C105, R35)\n• Trabajo infantil y juvenil: prohibir el trabajo infantil, comprobar la edad mínima legal y actuar ante cualquier situación identificada. Proteger a los menores de 18 años, cuando estén legalmente empleados, de tareas peligrosas y trabajo nocturno, sin perjuicio de su escolarización. (OIT C138, R146, C182, R190)\n• Discriminación e igualdad: se prohíbe y no se tolera ninguna forma de discriminación en las prácticas de empleo y ocupación. Se garantiza la igualdad de oportunidades y de trato, asegurando igual remuneración por trabajo de igual valor. (OIT C100, C111, R90, R111)\n• Libertad de asociación y negociación colectiva: se garantiza el derecho de los trabajadores a organizarse, adherirse a estructuras representativas y participar en procesos de negociación colectiva, sin interferencias ni represalias. (OIT C87, C98)\n• Condiciones de trabajo y seguridad: se garantizan condiciones laborales seguras, dignas e higiénicas mediante evaluaciones de riesgos y formación adecuada, bajo un sistema de inspección laboral. La empresa contribuye a políticas activas de promoción del pleno empleo. (OIT C81, C122)\n• Acoso y abuso: no se tolera el uso ni la amenaza de castigos corporales, coacción mental o física, intimidación, acoso o abuso de cualquier naturaleza.\n• Corrupción: la empresa prohíbe toda participación en actos de corrupción, extorsión, malversación y cualquier forma de soborno, directo o indirecto.\n• Remuneraciones: garantizar el salario mínimo legal o convencional aplicable a la categoría, el que sea mayor, incluido el trabajo a destajo; pagar puntualmente los salarios, complementos y prestaciones debidos y entregar recibos desglosados.\n• Tiempos de trabajo: registrar las horas reales de inicio, finalización y pausas; conservar los registros durante al menos cinco años y respetar los límites legales, descansos, vacaciones y normas de trabajo extraordinario, incluida su remuneración. No recurrir a horas extraordinarias coercitivas.\n• Permisos y protección social: respetar los derechos a vacaciones, maternidad y paternidad, enfermedad y demás ausencias y prestaciones legales, sin discriminación ni represalias.\n• Disciplina y bienestar: aplicar procedimientos disciplinarios legales y justos, con derecho de defensa y sin deducciones salariales disciplinarias prohibidas por GRASP. Cuando se proporcionen alojamiento y transporte, deberán cumplir las condiciones legales de seguridad y dignidad.\n\n3. Gestión de responsabilidades y quejas\n• Proceso confidencial de quejas: todos los trabajadores pueden presentar quejas y sugerencias, incluso de forma anónima, mediante la aplicación Persea — A Tua Voz (https://perseagrowers.github.io/a-tua-voz/), contactar con el representante de los trabajadores o del empleador, o acudir directamente a ACT y demás organismos competentes. Se prohíbe toda represalia. Las comunicaciones se tramitan oportunamente, según el Procedimiento de Reclamaciones y Gestión de Quejas vigente, con acceso restringido a los datos y posibilidad de consultar la respuesta mediante un código privado.\n• Diligencia debida y mejora continua: identificar riesgos para los derechos humanos, comprobar las prácticas laborales, investigar las situaciones comunicadas, corregir incumplimientos y supervisar la eficacia de las medidas adoptadas.\n\n4. Socios comerciales y no conformidad\n• Socios: comunicar esta política a las empresas de trabajo temporal y demás proveedores de mano de obra agrícola, exigir el cumplimiento de los mismos compromisos y comprobar las condiciones de empleo, remuneraciones, horarios y legalidad de la contratación. Informar a los demás subcontratistas y visitantes de la tolerancia cero ante las vulneraciones de los derechos humanos.\n• Comunicación: poner la política a disposición de los trabajadores directos y subcontratados y explicársela en un idioma que comprendan, informar a todos los supervisores y conservar pruebas adecuadas de dicha comunicación.\n• Revisión: revisar la política al menos cada tres años o antes si se producen cambios relevantes en la legislación laboral o en GRASP, lo que ocurra primero.\n• No conformidad: la empresa acepta que, si una comprobación de la evaluación GRASP demuestra cualquier vulneración de esta política, se considerará una no conformidad con este Punto y Criterio (P&C)."],["Política de Libertad de Asociación, Organización y Representación — revisión 2","I. COMPROMISO Y PRINCIPIOS FUNDAMENTALES\n\nFinca Tropic I, S.A. está firmemente comprometida con respetar y proteger los derechos humanos y laborales de todos sus colaboradores, incluidos trabajadores permanentes, temporales y subcontratados. Reconocemos el derecho inalienable de todas las personas a la libertad de asociación y organización, conforme a la Constitución de la República Portuguesa y al Código del Trabajo.\n\nNuestra declaración:\n• Libertad sindical: Finca Tropic I, S.A. reconoce el derecho de todos los trabajadores a crear, afiliarse o participar en sindicatos u otras organizaciones de trabajadores de su elección, así como a no afiliarse ni participar, sin interferencia de la empresa.\n• Negociación colectiva: respetamos el derecho a la negociación colectiva y nos comprometemos a interactuar de buena fe con los representantes legalmente elegidos.\n• Aplicación: esta política se aplica a todas las áreas y lugares de trabajo gestionados por Finca Tropic I, S.A.\n\nII. GARANTÍA DE REPRESENTACIÓN Y VOZ DE LOS TRABAJADORES\nPara garantizar que la dirección escuche y tenga en cuenta la voz de los trabajadores en todos los asuntos laborales, aplicamos los siguientes mecanismos:\n\n1. Representación y punto de contacto\n• José Albino es el representante elegido en 2024 para la Seguridad y Salud en el Trabajo. Su continuidad como representante GRASP depende de la decisión libre de los trabajadores actuales en cada año o ciclo productivo, que se documentará por separado.\n• El representante de los trabajadores, José Albino, actúa como enlace principal entre la plantilla y la dirección en cuestiones relacionadas con las condiciones de trabajo, la seguridad y el bienestar.\n• Se comunica a los trabajadores el nombre, la función y la forma de contactar con el representante durante el horario laboral, en lugares accesibles y en el Portal del Trabajador, sin divulgar datos personales de contacto sin autorización.\n\n2. Apoyo a la función del representante\n• La dirección se compromete a apoyar al representante elegido por los trabajadores, respetando su independencia.\n• El representante dispone de acceso a los trabajadores, tiempo y lugar adecuados para ejercer sus funciones. También se permite el acceso al lugar de trabajo a representantes sindicales y otras estructuras representativas legalmente reconocidas, conforme a la legislación aplicable.\n\n3. Información y derechos\n• Se informa a todos los trabajadores del derecho a constituir comisiones de trabajadores y asociaciones sindicales, a afiliarse o no a estas y a ejercer los derechos de representación (Código del Trabajo, artículo 440). Se facilitan los contactos sindicales pertinentes al representante y a los trabajadores.\n• La información se comunica al incorporarse y siempre que sea necesario, en un idioma comprendido por el trabajador, incluidos portugués, inglés, español, nepalí e hindi, con apoyo verbal cuando sea necesario.\n\n4. Prohibición de represalias y discriminación\n• Finca Tropic I, S.A. prohíbe toda discriminación, intimidación o represalia por afiliación o no afiliación sindical, actividad representativa, candidatura o ejercicio de funciones de representación.\n• Ningún trabajador será perjudicado ni verá comprometidos su remuneración, horario o puesto por ejercer sus derechos de representación o asociación.\n• Cualquier vulneración puede comunicarse confidencialmente, incluso de forma anónima, a través del Portal del Trabajador — A Tua Voz (https://perseagrowers.github.io/a-tua-voz/), al representante de los trabajadores o directamente a ACT o al sindicato, sin autorización previa de la empresa y sin represalias.\n\nIII. APROBACIÓN Y COMUNICACIÓN\nFinca Tropic I, S.A. se compromete a comunicar e implementar esta política entre todos los trabajadores, incluidos los subcontratados. La versión aprobada se pondrá a disposición en el Portal del Trabajador, sin perjuicio de la información presencial y las obligaciones legales de exposición de avisos."],["Procedimiento de Reclamaciones y Gestión de Quejas — revisión 2","I. DECLARACIÓN DE PRINCIPIOS Y GARANTÍAS\nFinca Tropic I, S.A. garantiza a todos los trabajadores, permanentes, temporales y subcontratados, el acceso a un proceso confidencial de reclamaciones y sugerencias, sin represalias, penalizaciones ni perjuicio del derecho a acudir a las autoridades y tribunales.\n• Accesibilidad y sencillez: la información se facilita en portugués, inglés, español, nepalí e hindi. Cuando sea necesario, se proporcionan instrucciones verbales o visuales en un idioma que comprenda el trabajador.\n• Reclamaciones verbales: se aceptan, incluidas las resueltas inmediatamente, registrando el asunto y la persona que lo resolvió. El trabajador puede solicitar anonimato o ayuda para presentar la reclamación.\n\nII. CANALES DE PRESENTACIÓN Y ACCESIBILIDAD\nEl canal principal es la aplicación Persea — A Tua Voz (https://perseagrowers.github.io/a-tua-voz/), accesible por código QR, sin cuenta Google. La identificación es opcional. Se mantiene la comunicación personal como alternativa.\nCanales disponibles: el trabajador puede elegir libremente cualquiera de las vías siguientes, incluido el recurso directo a un canal independiente, sin autorización de la empresa.\n\n1. Representante de los trabajadores: José Albino — personalmente o por representación; anonimato a petición. Independiente de la supervisión siempre que no ejerza funciones de supervisión.\n2. Autoridad para las Condiciones del Trabajo (ACT) — canal externo; confidencial según las normas de ACT. Autoridad independiente.\n3. Contacto directo con la representante del empleador (Marta Martins) — personalmente o por escrito; anonimato a petición. Canal interno, no independiente.\n4. Aplicación Persea — A Tua Voz — digital; anónima por defecto o identificada. Canal interno, no independiente.\n\nDivulgación e instrucciones\n• Exponer instrucciones y el código QR en lugares accesibles, incluidas las zonas de descanso, y divulgar los contactos externos. En el campo, el representante o persona designada debe estar accesible para ayudar a presentar reclamaciones, incluidas las anónimas. Informar a los trabajadores de la ubicación de los avisos y de los canales alternativos.\n• Nuevos trabajadores: explicar el mecanismo durante la acogida, incluidas las ETT y sus trabajadores. Conservar pruebas de la divulgación y garantizar la comprensión de las instrucciones.\n\nIII. PAPEL DE LA REPRESENTACIÓN DE LOS TRABAJADORES (3.3 Y 3.5)\nEl representante de los trabajadores (José Albino) debe recibir instrucciones documentadas sobre el uso del mecanismo y las siguientes responsabilidades:\n1. Confidencialidad: el representante tiene la obligación de mantener toda la información confidencial.\n2. Autorización: solo puede presentar una queja en nombre de otro trabajador si dispone de su consentimiento expreso (documento de consentimiento archivado, si procede).\n3. Anonimato: si se solicita al representante que actúe para proteger el anonimato del reclamante, la dirección debe respetar la petición y garantizar que no afecte al resultado de la queja.\n4. Notificación: la representante del empleador informa a José Albino de la recepción y el resultado de las reclamaciones sin transmitir la identidad ni detalles que permitan identificar al trabajador.\n5. Apoyo: si el representante no puede actuar, el trabajador puede buscar apoyo independiente, incluida ACT, sin pasar por la dirección. La empresa facilita los contactos necesarios.\n\nIV. RESOLUCIÓN Y PLAZOS\nLa representante del empleador coordina el análisis, deriva los asuntos y supervisa los plazos. La dirección y RR. HH. garantizan los medios y decisiones necesarios. Los asuntos urgentes de seguridad o riesgo de represalias requieren intervención inmediata; en caso de emergencia, llamar al 112.\n\nPlazos de resolución\n• Trabajadores directos: procurar concluir el análisis y comunicar la decisión en un máximo de 30 días o antes del último día de empleo, si es anterior.\n• Trabajadores subcontratados: aplicar el mismo límite de 30 días o el último día del contrato de prestación de servicios, si es anterior. Ajustar manualmente el plazo automático de la hoja cuando sea necesario.\n\nTramitación de la resolución\n1. Respuesta: comunicar la decisión motivada, las acciones adoptadas o el motivo por el que no se ha podido resolver. Utilizar un idioma que comprenda el trabajador.\n2. Quejas anónimas: en la aplicación, el trabajador conserva el código privado para consultar la respuesta. Publicar también un aviso general de la respuesta en los lugares de información de los trabajadores, sin nombres ni detalles identificativos. No publicar información sensible.\n3. Retrasos: registrar la causa, la previsión de finalización y la comunicación al trabajador. Si la identificación es voluntaria, utilizar el contacto indicado; si es anónima, facilitar la actualización por el canal adecuado.\n\nReclamaciones de trabajadores subcontratados\n• Dentro del contrato comercial: Finca Tropic investiga las condiciones en el lugar, se coordina con
