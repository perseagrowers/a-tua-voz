ता:\n१. काम सुरु हुनुअघि वा हालका श्रमिकका लागि यो संशोधन प्राप्त गरेपछि नीति र प्रक्रिया उनीहरूले बुझ्ने भाषामा उपलब्ध गराउने र बुझाउने।\n२. Persea — A Tua Voz पोर्टल (https://perseagrowers.github.io/a-tua-voz/), QR कोड, नाम नखुलाई वा पहिचानसहित गुनासो दिने र निजी रूपमा जवाफ हेर्ने तरिका प्रचार गर्ने। श्रमिक प्रतिनिधि र ACT मा सिधै पहुँचबारे जानकारी दिने।\n३. प्रतिशोध नहुने सुनिश्चित गर्ने, श्रम दायित्व पालना गर्ने र व्यक्तिगत तथ्याङ्क संरक्षणको सम्मान गर्दै जाँचका लागि अनुपालनका प्रमाण उपलब्ध गराउने।\n\nIII. कागजात प्राप्तिको पुष्टि\nहस्ताक्षरद्वारा पक्षहरूले तोकिएको मितिमा कागजात सञ्चार र प्राप्ति भएको पुष्टि गर्छन्। साझेदारले अद्यावधिक जानकारी आफ्ना श्रमिकलाई दिने र सम्भावित गैर-अनुपालन समाधान गर्न सहयोग गर्ने प्रतिबद्धता जनाउँछ।"],["जानकारी र बुझाइको घोषणा — GRASP","प्रत्येक श्रमिकले हस्ताक्षरमार्फत निम्न जानकारी प्राप्त गरेको वा हेरेको, आफूले बुझ्ने भाषामा बुझाइएको र प्रश्न स्पष्ट गर्ने अवसर पाएको पुष्टि गर्छ:\n• मानव अधिकार नीति र संघ गठनको स्वतन्त्रता नीति;\n• असल आचरण संहिता र उत्पीडन रोकथाम; अनुशासनात्मक प्रक्रिया;\n• श्रम अधिकार निर्देशिका २०२६ र GRASP मूल्याङ्कन सूचना;\n• गुनासो प्रक्रिया, नामको गोपनीयता, प्रतिशोध निषेध र बाह्य सहयोग;\n• श्रमिक पोर्टल: पहुँच, भाषा चयन र निजी कोडबाट जवाफ हेर्ने।\nपोर्टल: https://perseagrowers.github.io/a-tua-voz/\nहस्ताक्षरले वास्तविक रूपमा दिइएको जानकारी पुष्टि गर्छ र अधिकार त्यागेको मानिँदैन।"],["श्रम अधिकार निर्देशिका — २०२६","१. न्यूनतम पारिश्रमिक — २०२६\nFinca Tropic I, S.A. र Extraissol, Lda. का प्रत्यक्ष र अस्थायी श्रमिकका लागि जानकारी।\nAHSA–SETAAB सामूहिक श्रम सम्झौता (CCT) लागू हुने पूर्णकालीन कामको मासिक कुल रकम। मुख्यभूमि पोर्चुगलको राष्ट्रिय न्यूनतम तलब 920 € छ; CCT को तह 11 मा 925 € (राष्ट्रिय न्यूनतम + 5 €) छ।\nतह — पेसागत वर्ग — न्यूनतम:\n1. महाप्रबन्धक — 1 480 €\n2. सेवा निर्देशक — 1 250 €\n3. क्षेत्र प्रबन्धक; प्रमाणित लेखापाल — 1 200 €\n4. वरिष्ठ प्राविधिक वा क्षेत्र विशेषज्ञ — 1 100 €\n5. उत्पादन सहायक; क्षेत्र संयोजक — 1 060 €\n6. क्षेत्र प्राविधिक — 1 050 €\n7. गोदाम इन्चार्ज; व्यवस्थापन सचिव — 1 030 €\n8. प्रशासनिक सहायक; क्षेत्र सुपरभाइजर; मर्मत प्राविधिकको सहायक — 985 €\n9. टोली प्रमुख — 960 €\n10. कृषि मेसिन सञ्चालक; बाली संरक्षण औषधि र मल प्रयोगकर्ता; समय अभिलेखकर्ता; सुपरिवेक्षण सहायक; चालक — 950 €\n11. गोदाम कर्मचारी; सम्पत्ति रक्षक; औद्योगिक सफाइ, उत्पादन लाइन वा सिँचाइ सञ्चालक; कृषि श्रमिक; गोदाम सहायक; सहायक श्रमिक — 925 €\nस्रोत: अनुसूची III, तालिका B, BTE 15/2025 को सुधार, पृष्ठ 160; DL 139/2025। पेसागत वर्ग वास्तविक कामअनुसार हुनुपर्छ। परिवर्तनशील वा उत्पादनको परिमाणमा आधारित पारिश्रमिकले लागू न्यूनतम तलब हटाउँदैन (धारा 57)।\n\n२. भुक्तानी र भत्ता\nतलब, थप रकम, कटौती र खुद रकमको विवरण भएको तलब पर्ची पाउनुहोस्। सम्बन्धित महिनामै भुक्तानी गर्नुपर्छ; सम्झौता वा थप सम्झौतामा स्पष्ट सहमति भएमा CCT ले अर्को महिनाको 10 तारिखसम्म भुक्तानी अनुमति दिन्छ (धारा 59)। खाना भत्ता: सामान्य दैनिक कामको आधाभन्दा बढी काम गरेमा वास्तविक काम गरेको प्रत्येक दिन 6 € (धारा 66)।\n\n३. कार्यसमय, विश्राम र आराम\nसामान्य नियम: सोमबारदेखि शनिबारसम्म बाँडिएको दैनिक 8 घण्टा र साप्ताहिक 40 घण्टा। 30 मिनेटदेखि 2 घण्टासम्म विश्राम; सामान्यतः लगातार 5 घण्टाभन्दा बढी काम होइन (दैनिक अवधि 10 घण्टाभन्दा बढी भए 6 घण्टा)। सामान्यतः दैनिक लगातार 11 घण्टा आराम। शनिबार वा आइतबार अनिवार्य साप्ताहिक आराम, कृषि सिजनमा परिवर्तन हुन सक्छ। वास्तविक सुरु, अन्त्य र विश्राम समय अभिलेख गर्ने। (CCT धारा 18, 25, 26 र 36; श्रम संहिता धारा 202।)\n\n४. अतिरिक्त काम (ओभरटाइम)\nकानुनी कारण र अभिलेख हुनुपर्छ। CCT का सामान्य सीमा: वर्षमा 200 घण्टा र सामान्य कार्यदिनमा 2 घण्टा, अपरिहार्य अवस्था र अन्य कानुनी सीमाबाहेक; अंशकालीन काममा धारा 31 को समानुपातिक नियम लागू हुन्छ। उचित कारण भए छुट माग्न सकिन्छ। जबरजस्ती काम स्वीकार्य छैन।\nसामान्य प्रतिघण्टा तलबमाथि थप रकम — वर्षमा 100 घण्टासम्म / 100 घण्टाभन्दा बढी:\n• कार्यदिन — पहिलो घण्टा: 25% / 50%।\n• कार्यदिन — त्यसपछिका घण्टा: 37.5% / 75%।\n• साप्ताहिक आराम वा सार्वजनिक बिदा — प्रत्येक घण्टा: 50% / 100%।\nआराम वा सार्वजनिक बिदाका प्रत्येक घण्टाको दर श्रम संहिताको धारा 268 बाट आउँछ, जुन कम लाभदायक प्रावधानभन्दा माथि लागू हुन्छ। अनिवार्य साप्ताहिक आरामको दिन काम गरेमा त्यसपछिका तीन कार्यदिनमध्ये एक दिन पारिश्रमिकसहित क्षतिपूरक आराम पाउने अधिकार हुन्छ। (CCT धारा 28–33, 60।)\n\n५. रातिको काम, कार्यसमय सीमाबाट छुट र अनुकूलनशीलता\nरातिको काम: 20:00–07:00, 25% थप पारिश्रमिक (धारा 34 र 67)। कार्यसमय सीमाबाट छुटका लागि लिखित सम्झौता र कानुनी व्यवस्था चाहिन्छ; धारा 62 ले सामान्य सीमामा नबाँधिने अवस्थामा न्यूनतम पारिश्रमिकको 25% र अन्य अवस्थामा 5–10% तोक्छ, लागू कानुनी प्रत्याभूतिमा असर नपर्ने गरी। अतिरिक्त कामको भुक्तानीका लागि साप्ताहिक आराम र सार्वजनिक बिदा छुटमा समावेश हुँदैनन्।\nअनुकूलनशीलता (धारा 19): दैनिक थप 2 घण्टा र साप्ताहिक 50 घण्टासम्म, छ महिनामा सामान्य अवधिको औसत कायम गरी बराबर क्षतिपूर्ति दिने। कार्यतालिका 15 दिनअगाडि जानकारी दिनुपर्ने र पहिले SETAAB सँग परामर्श गर्नुपर्ने। समय बैंक कानुनी रूपमा स्थापना भएको अवस्थामा मात्र, आफ्नै अभिलेख र क्षतिपूर्तिसहित (धारा 21)। ओभरटाइमसँग नझुक्किनुहोस्।\n\n६. वार्षिक र सार्वजनिक बिदा\nवार्षिक 22 कार्यदिन; CCT ले धारा 40 को उपस्थितिको सर्तसहित दुईसम्म उचित अनुपस्थिति (वा चार आधा दिन) भए थप 2 दिन, तीनसम्म अनुपस्थिति (वा छ आधा दिन) भए थप 1 दिन प्रदान गर्छ। नियुक्तिको वर्षमा प्रति महिना 2 कार्यदिन, अधिकतम 20, सामान्यतः छ महिनापछि। पारिश्रमिकसहित बिदा र बिदा भत्ता; एक महिनाको पारिश्रमिक बराबर क्रिसमस भत्ता, लागू भए समानुपातिक। कार्निभल र नगरपालिका बिदा पनि CCT मा छन्। (धारा 37, 39–42, 63–64।)\n\n७. अनुपस्थिति, बिरामी, मातृत्व/पितृत्व र सामाजिक संरक्षण\nअनुपस्थिति रोजगारदातालाई जानकारी दिनुहोस् र आवश्यक पर्दा प्रमाण दिनुहोस्। उचित अनुपस्थिति सधैँ पारिश्रमिकसहित हुँदैन। कानुनी सर्तअनुसार बिरामी हुँदा सामाजिक सुरक्षाको सुविधा पाउन सकिन्छ। आमा र बाबुलाई श्रम संहिता र सामाजिक सुरक्षा प्रणालीअनुसार बिदा, कामबाट छुट र विशेष संरक्षणको अधिकार छ। विशेष सर्तका लागि seg-social.pt र cite.gov.pt हेर्नुहोस्। (श्रम संहिता धारा 33–65, 248–257।)\n\n८. तालिम र रोजगार सर्त\nवार्षिक 40 घण्टा निरन्तर तालिमको अधिकार; तीन महिना वा बढीका निश्चित अवधिका सम्झौतामा समानुपातिक। कानुनअनुसार प्रमाणित तालिम र तालिम क्रेडिट (CCT धारा 7–9; श्रम संहिता धारा 131–132)। रोजगार सर्त, कामको भूमिका, कार्यसमय, पारिश्रमिक, बिदा र लागू सामूहिक सम्झौताबारे लिखित जानकारी पाउने अधिकार (श्रम संहिता धारा 106–107)।\n\n९. अस्थायी र आप्रवासी श्रमिक\nETT का श्रमिकलाई श्रम संहिता धारा 185 अनुसार बढी लाभदायक कार्य अवस्था र पारिश्रमिक, कामको वर्गमा लागू न्यूनतम रकमसहित, पाउने अधिकार छ। बुझिने जानकारी, सहयोग माध्यममा पहुँच र गुनासो दिने अवसर पाउनुपर्छ। व्यक्तिगत कागजात रोक्न र जबरजस्ती श्रम गराउन निषेध छ।\n\n१०. समानता, सुरक्षा र प्रतिनिधित्व\nसमान मूल्यको काममा समान व्यवहार र पारिश्रमिक; भेदभाव, उत्पीडन र प्रतिशोध निषेध। ट्रेड युनियनमा आबद्ध हुने वा नहुने र प्रतिनिधि रोज्ने अधिकार। सुरक्षित अवस्था, जानकारी, तालिम र उपयुक्त व्यक्तिगत सुरक्षा उपकरण (EPI) निःशुल्क पाउने र खतरा रिपोर्ट गर्ने अधिकार। (श्रम संहिता धारा 23–29, 127, 281, 440; कानुन 102/2009।)\n\n११. गुनासो र सम्पर्क\nA Tua Voz पोर्टल: https://perseagrowers.github.io/a-tua-voz/ — ऐच्छिक पहिचानसहित गुनासो र सुझाव तथा निजी कोडबाट जवाफ हेर्ने। श्रमिक प्रतिनिधि José Albino वा सिधै ACT (300 069 300), SETAAB (213 931 200 / 937 955 329), CITE (800 204 684) वा सामाजिक सुरक्षा (300 502 502) लाई सम्पर्क गर्न सक्नुहुन्छ।\nआपतकाल: 112।\n\nस्रोत र अद्यावधिक नियन्त्रण\nCCT AHSA–SETAAB, BTE 11/2025, पृष्ठ 17–54:\nhttps://bte.dgcp.mtsss.gov.pt/completos/2025/bte11_2025.pdf\nसुधार BTE 15/2025, पृष्ठ 159–160; Portaria 388/2025/1, 12/11; श्रम संहिता (कानुन 7/2009, वर्तमान पाठ); DL 139/2025। जानकारी 24/11/2026 मा समीक्षा गरिएको। सूचनामूलक निर्देशिका: कानुन वा बढी लाभदायक सर्तको विकल्प होइन। जनवरी २०२७ वा कानुनी परिवर्तन हुँदा समीक्षा गर्ने।"]];fill('policiesSection',({PT:fullGraspPT,ES:fullGraspES,EN:fullGraspEN,NE:fullGraspNE})[document.getElementById('lang').value]||t.p,true);fill('representationSection',[t.rep],false);fill('safetySection',t.s,true);const root=document.getElementById('lawSectionContent');root.replaceChildren();p(root,t.law);portalSourceLinks.forEach(([name,url])=>{const a=document.createElement('a');a.href=url;a.textContent=name;a.target='_blank';a.rel='noopener noreferrer';const e=document.createElement('p');e.append(a);root.append(e)});docum
